function save(){localStorage.setItem(KEY,JSON.stringify(state.data))}
function load(){try{const r=localStorage.getItem(KEY);if(r)state.data={...state.data,...JSON.parse(r)}}catch(e){}}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),1800)}
function navigate(p){state.page=p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===p));document.getElementById("pageTitle").textContent=pages[p];document.getElementById("sidebar").classList.remove("open");render()}
document.addEventListener("click",e=>{const n=e.target.closest(".nav");if(n)navigate(n.dataset.page)});

function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"}
function stats(){
 const d=state.data, t=today();
 return {todo:d.tasks.filter(x=>x.status!=="DONE").length,due:d.tasks.filter(x=>x.due&&x.due<=t&&x.status!=="DONE").length,apps:d.jobs.filter(x=>x.status==="APPLIED").length,interviews:d.jobs.filter(x=>x.status==="INTERVIEW").length}
}

function inferJob(j){
 const text=(j.title+" "+j.description+" "+(j.level||"")).toLowerCase();
 const explicitEntry=/(no experience|required no experience|entry[- ]level|fresh graduate|fresh graduates|0[-– ]?1 year|junior|training provided|career shifter)/i.test(text);
 const senior=/(senior|lead |manager|director|head of|principal|staff engineer|5\+ years|7\+ years|10\+ years)/i.test(text);
 const possibleEntry=!senior && /(assistant|associate|coordinator|support|junior|intern|trainee)/i.test(text);
 const negotiationExplicit=/(negotiable|depending on experience|\bdoe\b|based on experience|based on skills)/i.test(text);
 const negotiationPossible=!negotiationExplicit && (!!j.salaryMin&&!!j.salaryMax&&j.salaryMax>j.salaryMin);
 const red=[];
 if(/unpaid trial|pay to apply|payment.*training|purchase.*equipment.*before|telegram only|crypto payment/i.test(text))red.push("Review unusual payment/trial language");
 return {...j,entryFlag:explicitEntry?"VERIFIED":possibleEntry?"POSSIBLE":"",negFlag:negotiationExplicit?"EXPLICIT":negotiationPossible?"POSSIBLE":"",red};
}
async function loadLiveJobs(force=false){
 const status=document.getElementById("liveStatus");if(status)status.textContent="Loading free/public job feeds…";
 try{
  const cached=JSON.parse(localStorage.getItem(JOB_CACHE_KEY)||"null");
  if(!force&&cached&&Date.now()-cached.time<DAY){
    state.liveJobs=cached.jobs.map(inferJob);
    state.sourceHealth=cached.sourceHealth||{};
    state.liveStatus=`Using 24-hour cache · last refreshed ${new Date(cached.time).toLocaleString()}`;
    render();return
  }
 }catch(e){}
 const results=[],health={};

 try{
  const r=await fetch("https://jobicy.com/api/v2/remote-jobs?count=100");
  if(!r.ok)throw new Error("Jobicy HTTP "+r.status);
  const d=await r.json();
  (d.jobs||[]).forEach(x=>results.push(inferJob({
    id:"jobicy-"+x.id,source:"Jobicy",freshness:"CURRENT FEED",
    title:x.jobTitle,company:x.companyName,location:x.jobGeo||"Remote",
    type:Array.isArray(x.jobType)?x.jobType.join(", "):(x.jobType||""),
    level:x.jobLevel||"",description:strip(x.jobDescription||x.jobExcerpt),
    url:x.url,pubDate:x.pubDate,salaryMin:x.salaryMin,salaryMax:x.salaryMax,
    currency:x.salaryCurrency,period:x.salaryPeriod,remote:true
  })));
  health.Jobicy={status:"LIVE",note:"Public API"};
 }catch(e){health.Jobicy={status:"UNAVAILABLE",note:"Could not load in this browser"}}

 try{
  const r=await fetch("https://www.arbeitnow.com/api/job-board-api");
  if(!r.ok)throw new Error("Arbeitnow HTTP "+r.status);
  const d=await r.json();
  (d.data||[]).slice(0,100).forEach(x=>results.push(inferJob({
    id:"arbeit-"+(x.slug||uid()),source:"Arbeitnow",freshness:"CURRENT FEED",
    title:x.title,company:x.company_name,location:x.location||"",
    type:(x.tags||[]).join(", "),level:"",description:strip(x.description),
    url:x.url,pubDate:x.created_at?new Date(x.created_at*1000).toISOString():"",
    remote:!!x.remote
  })));
  health.Arbeitnow={status:"LIVE",note:"Public API"};
 }catch(e){health.Arbeitnow={status:"UNAVAILABLE",note:"Could not load in this browser"}}

 try{
  const r=await fetch("https://remotive.com/api/remote-jobs?limit=100");

  })));

 }catch(e){health.Remotive={status:"UNAVAILABLE",note:"Could not load in this browser"}}

 results.forEach(x=>dedup.set((x.title+"|"+x.company).toLowerCase(),x));

 }
 render();
}

function filteredLiveJobs(){
 const q=(document.getElementById("jq")?.value||"").toLowerCase(),
 src=document.getElementById("jsource")?.value||"All sources",
 ent=document.getElementById("jentry")?.value||"Any experience",
 sal=document.getElementById("jsalary")?.value||"Any salary",
 rem=document.getElementById("jremote")?.value||"All jobs",
 date=document.getElementById("jdate")?.value||"Any date",
 loc=(document.getElementById("jlocation")?.value||"").toLowerCase(),
 niches=(state.data.profile.niches||[]).map(x=>x.toLowerCase());
 let maxAge=Infinity;
 if(date==="Last 24 hours")maxAge=1;
 if(date==="Last 3 days")maxAge=3;
 if(date==="Last 7 days")maxAge=7;
 if(date==="Last 30 days")maxAge=30;
 let out=state.liveJobs.filter(j=>{
  const blob=(j.title+" "+j.company+" "+j.description+" "+j.type+" "+j.location).toLowerCase();
  const age=j.pubDate?(Date.now()-new Date(j.pubDate).getTime())/86400000:0;
  return (!q||blob.includes(q))
   &&(src==="All sources"||j.source===src)
   &&(ent==="Any experience"||(ent==="Verified entry-level"&&j.entryFlag==="VERIFIED")||(ent==="Possible entry-level"&&(j.entryFlag==="VERIFIED"||j.entryFlag==="POSSIBLE")))
   &&(sal==="Any salary"||salaryText(j)!=="Salary not listed")
   &&(rem==="All jobs"||j.remote)
   &&(!loc||(j.location||"").toLowerCase().includes(loc)||blob.includes(loc))
   &&age<=maxAge
 });
 if(state.jobView==="Newest")out.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
 if(state.jobView==="Salary Disclosed")out=out.filter(j=>salaryText(j)!=="Salary not listed");

 return out
}

async function handleCareerFiles(list){const files=[...list];let added=0,failed=[];for(const file of files){try{const text=await extractCareerFileText(file);if(!text.trim())throw Error("No readable text found");if(state.data.profileDocs.length>=12)throw Error("Vault limit reached (12 resources)");state.data.profileDocs.push({id:uid(),name:file.name,type:file.type||file.name.split(".").pop(),kind:guessDocKind(file.name),text:text.slice(0,180000),addedAt:new Date().toISOString()});added++}catch(e){failed.push(`${file.name}: ${e.message}`)}}save();render();if(added)toast(`${added} resource${added===1?"":"s"} added`);if(failed.length)modal(`<h3>Some files could not be read</h3><p class="small muted">${failed.map(esc).join("<br>")}</p><p>For scanned/image-only PDFs, paste the relevant text manually.</p>`)}
async function extractCareerFileText(file){const ext=(file.name.split(".").pop()||"").toLowerCase();if(["txt","md","csv","json"].includes(ext))return await file.text();if(ext==="docx"){if(!window.mammoth)throw Error("DOCX reader did not load");const b=await file.arrayBuffer(),r=await mammoth.extractRawText({arrayBuffer:b});return r.value||""}if(ext==="pdf"){if(!window.pdfjsLib)throw Error("PDF reader did not load");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const b=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:b}).promise,p=[];for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),tc=await page.getTextContent();p.push(tc.items.map(x=>x.str).join(" "))}return p.join("\n")}throw Error("Unsupported file type")}

const FIT_SKILLS=["google workspace","gmail","google calendar","google sheets","google docs","microsoft office","excel","word","powerpoint","outlook","canva","capcut","photoshop","figma","notion","clickup","trello","asana","slack","zoom","calendly","loom","hubspot","salesforce","gohighlevel","mailchimp","manychat","zapier","make.com","n8n","shopify","woocommerce","amazon","quickbooks","xero","bookkeeping","data entry","crm","lead generation","prospecting","cold email","calendar management","inbox management","email management","travel planning","meeting coordination","executive support","administrative support","project management","operations","sop","research","market research","customer support","customer service","community management","social media management","content creation","content scheduling","copywriting","seo","google analytics","meta business suite","facebook ads","google ads","recruitment","candidate sourcing","interview scheduling","onboarding","real estate","property management","transaction coordination","wordpress","webflow","html","css","javascript","python","sql","data analysis","communication","time management","organization","attention to detail"];
const FIT_STOP=new Set("the and for with that this from your you are our their have has had will would should could can may into about job role work working required requirements preferred plus team company candidate candidates responsibilities responsibility skills skill experience years year remote position looking must using use used support".split(" "));
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9+#. ]+/g," ").replace(/\s+/g," ").trim()}
function fitKeywords(text){const low=norm(text),skills=FIT_SKILLS.filter(x=>low.includes(x)),words=low.split(" ").filter(w=>w.length>3&&!FIT_STOP.has(w)),freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);return{skills:[...new Set(skills)],common:Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,20).map(x=>x[0])}}
function fitEvidence(corpus,terms){const sent=String(corpus||"").replace(/\s+/g," ").split(/(?<=[.!?])\s+|\n+/).filter(Boolean),out=[];for(const term of terms){const x=sent.find(s=>norm(s).includes(norm(term)));if(x)out.push({term,snippet:x.slice(0,240)})}return out.slice(0,8)}
function evidenceFitAnalysis(jobText,job={}){const corpus=profileCorpus(),hasDocs=state.data.profileDocs.length>0,jk=fitKeywords(jobText),matched=jk.skills.filter(x=>norm(corpus).includes(norm(x))),missing=jk.skills.filter(x=>!matched.includes(x)),common=jk.common.filter(w=>norm(corpus).split(" ").includes(w)),skill=jk.skills.length?matched.length/jk.skills.length:Math.min(1,common.length/10),roleWords=norm(job.title||"").split(" ").filter(w=>w.length>3&&!FIT_STOP.has(w)),role=roleWords.length?roleWords.filter(w=>norm(corpus).includes(w)).length/roleWords.length:.5,loc=norm((job.location||"")+" "+jobText),pref=norm(state.data.profile.location||"");let locScore=.75,locNote="Location/schedule needs manual confirmation.";if(/worldwide|anywhere|remote/.test(loc)){locScore=1;locNote="Remote/worldwide language detected."}if(/us only|united states only|must reside in the us/.test(loc)&&/philippines/.test(pref)){locScore=.15;locNote="Possible location mismatch: listing appears US-only."}const score=Math.max(0,Math.min(100,Math.round((skill*.62+role*.23+locScore*.1+(hasDocs?1:.35)*.05)*100))),label=score>=75?"STRONG FIT":score>=55?"POSSIBLE FIT":"WEAK / UNCLEAR FIT";return{score,label,confidence:hasDocs?(state.data.profileDocs.length>=2?"HIGH":"MEDIUM"):"LOW",matchedSkills:matched,missingSkills:missing,locNote,evidence:fitEvidence(corpus,matched.length?matched:common.slice(0,6))}}
function fitResultHTML(a){return `<div class="fitgrid"><div class="fitmetric"><span class="small muted">Evidence Fit</span><strong>${a.score}%</strong></div><div class="fitmetric"><span class="small muted">Assessment</span><strong style="font-size:15px">${a.label}</strong></div><div class="fitmetric"><span class="small muted">Confidence</span><strong style="font-size:15px">${a.confidence}</strong></div><div class="fitmetric"><span class="small muted">Vault Resources</span><strong>${state.data.profileDocs.length}</strong></div></div><p class="small muted">Evidence screening only; not a hiring guarantee.</p><div class="grid"><div class="c6"><h4>Matched evidence</h4>${a.matchedSkills.length?`<div class="row">${a.matchedSkills.map(x=>`<span class="pill good">${esc(x)}</span>`).join("")}</div>`:"<p class='small muted'>No exact skill phrase match.</p>"}${a.evidence.map(e=>`<div class="evidence"><strong>${esc(e.term)}</strong><br>${esc(e.snippet)}</div>`).join("")}</div><div class="c6"><h4>Gaps / verify</h4>${a.missingSkills.length?`<div class="row">${a.missingSkills.slice(0,12).map(x=>`<span class="pill warn">${esc(x)}</span>`).join("")}</div>`:"<span class='pill good'>No exact skill gaps detected.</span>"}<p class="small"><strong>Eligibility:</strong> ${esc(a.locNote)}</p></div></div>`}
function groundedKit(job,a){const name=state.data.profile.name||"Applicant",matched=a.matchedSkills.slice(0,6),ev=a.evidence.slice(0,3),company=job.company||"the company",role=job.title||"the advertised role",skills=matched.length?matched.join(", "):"the relevant skills reflected in my uploaded materials",evidence=ev.length?ev.map(x=>x.snippet).join(" "):"My uploaded materials contain the background I would use to discuss my fit for this role.",gaps=a.missingSkills.slice(0,3);return{cover:`Dear Hiring Team,\n\nI am applying for the ${role} opportunity at ${company}. After reviewing the role against my resume and supporting materials, the strongest areas of alignment include ${skills}.\n\n${evidence}\n\nI am interested in contributing to the responsibilities described in the posting while bringing a dependable approach to communication, organization and follow-through.${gaps.length?` I also noted areas I would clarify or continue developing, including ${gaps.join(", ")}, and I would be transparent about those during the process.`:""}\n\nI would welcome the opportunity to discuss how my actual experience and skills can support your team.\n\nSincerely,\n${name}`,email:`Subject: Application — ${role}\n\nHello,\n\nI’m reaching out regarding the ${role} opening at ${company}. My background aligns most clearly with ${skills}. I reviewed the role carefully and would be glad to discuss how my experience can support the team.\n\nPortfolio/Resume: [attach or insert your approved link]\n\nThank you,\n${name}`,interview:`INTERVIEW PREP — ${role} at ${company}\n\nEvidence to discuss:\n${ev.length?ev.map((x,i)=>`${i+1}. ${x.term}: ${x.snippet}`).join("\n"):"1. Select one truthful example from your uploaded materials."}\n\nGaps / requirements to clarify:\n${gaps.length?gaps.map((x,i)=>`${i+1}. ${x}`).join("\n"):"1. Verify schedule, tools, scope and success measures."}\n\nQuestions:\n1. What are the top priorities in the first 30–60 days?\n2. What does strong performance look like?\  {name:"E-commerce",terms:["e-commerce","ecommerce","shopify","amazon","product listing","order management","customer orders"]},
 {name:"Bookkeeping / Finance",terms:["bookkeeping","quickbooks","xero","accounts payable","accounts receivable","invoicing","expense tracking"]},
 {name:"Operations / SOP",terms:["operations","sop","standard operating procedure","process improvement","workflow","process documentation","operations support"]},
 {name:"Communication",terms:["communication","written communication","verbal communication","client communication","professional communication"]},
 {name:"Google Workspace",terms:["google workspace","google docs","google sheets","google drive","gmail","google calendar"]},
 {name:"Microsoft Office",terms:["microsoft office","excel","word","powerpoint","outlook"]},
 {name:"AI / Automation",terms:["chatgpt","claude","gemini","ai tools","automation","zapier","make.com","n8n","ai automation"]}
];
function familyMatches(text){const low=norm(text);return FIT_FAMILIES.filter(f=>f.terms.some(t=>low.includes(norm(t))))}
function extractHardSignals(text){
 const low=String(text||"").toLowerCase(),yrs=[...low.matchAll(/(\d+)\s*(?:\+|plus)?\s*(?:years?|yrs?)(?:\s+of)?\s+(?:experience|exp)/g)].map(x=>+x[1]),s=[];
 if(/graveyard|night shift|us hours|est hours|pst hours|cst hours/.test(low))s.push("US / night-shift schedule mentioned");
 if(/uk hours|gmt/.test(low))s.push("UK/GMT schedule mentioned");
 if(/australia|australian hours|aest/.test(low))s.push("AU schedule mentioned");
 if(/philippines only|philippines-based|filipino|philippine/.test(low))s.push("Philippines eligibility mentioned");
 if(/us only|united states only|must reside in the us/.test(low))s.push("US-only location requirement");
 return{years:yrs.length?Math.max(...yrs):0,schedules:s,explicitNoExperience:/no experience required|entry[- ]level|fresh graduates|fresh graduate|training provided|0[-– ]?1 year/.test(low),degree:/bachelor'?s degree|college degree|degree required/.test(low),portfolio:/portfolio required|portfolio is required|submit.*portfolio/.test(low)}
}
function manualFitAnalysis(jobText,job={}){
 const corpus=profileCorpus(),jobFam=familyMatches(jobText),profileFam=familyMatches(corpus),profileNames=new Set(profileFam.map(x=>x.name)),matched=jobFam.filter(x=>profileNames.has(x.name)),missing=jobFam.filter(x=>!profileNames.has(x.name)),hard=extractHardSignals(jobText),evidence=fitEvidence(corpus,matched.flatMap(x=>x.terms).slice(0,18)),transferable=[];
 if(!profileNames.has("Project / Task Management")&&/(coordinate|organize|track|deadline|project)/i.test(jobText)&&/(operations|manager|supervis|admin)/i.test(corpus))transferable.push("Your operations/admin experience may transfer to project coordination.");
 if(!profileNames.has("Customer Support")&&/(customer|client|support)/i.test(jobText)&&/(customer|client|communication)/i.test(corpus))transferable.push("Your client/customer-facing experience may transfer to support work.");
 if(!profileNames.has("Executive Support")&&/(executive assistant|executive support|founder|ceo)/i.test(jobText)&&/(manager|operations|administrative support|office)/i.test(corpus))transferable.push("Your management/admin background may transfer to executive support, but executive-level ownership should be verified.");
 if(!profileNames.has("CRM")&&/\bcrm\b/i.test(jobText)&&/(lead|contact|tracker|pipeline|database)/i.test(corpus))transferable.push("Your lead/contact tracking experience may transfer to CRM work; the specific platform still needs verification.");
 let blocker=false,blockerNotes=[],pref=norm(state.data.profile.location||"");
 if(/us only|united states only|must reside in the us/.test(norm(jobText))&&/philippines/.test(pref)){blocker=true;blockerNotes.push("Listing appears US-only while your saved profile indicates Philippines.")}
 const py=yearsEvidence(corpus);
 if(hard.years>=5&&py!=null&&py<hard.years)blockerNotes.push(`Listing mentions ${hard.years}+ years; your uploaded materials explicitly show about ${py}+ years.`);
 const coverage=jobFam.length?matched.length/jobFam.length:(evidence.length?0.55:0.35);
 let verdict="POSSIBLE FIT",tone="warn",reason="";
 if(blocker){verdict="LIKELY NOT ELIGIBLE";tone="bad";reason="A hard location/eligibility mismatch was detected."}
 else if(coverage>=0.68||(matched.length>=5&&missing.length<=3)){verdict="GOOD FIT";tone="good";reason="Your saved background covers many of the job's recurring skill areas."}
 else if(coverage>=0.4||matched.length>=3||transferable.length>=2){verdict="POSSIBLE FIT";tone="warn";reason="There is meaningful overlap, but some requirements still need verification."}
 else{verdict="STRETCH / LOW EVIDENCE";tone="bad";reason="Your current saved materials show limited evidence for this post. This is an evidence gap, not an automatic rejection."}
 return{verdict,tone,reason,confidence:state.data.profileDocs.length>=2?"HIGH":state.data.profileDocs.length===1?"MEDIUM":"LOW",matched,missing,transferable,hard,evidence,blockerNotes}
}

function builder(fields,title){return fields.map((f,i)=>`<label>${f}</label><textarea id="b${i}"></textarea>`).join("")+`<button class="btn primary" onclick="copyBuilder(${fields.length},'${title}')">Copy Structured Output</button>`}
function copyBuilder(n,title){let s=title+"\n\n";for(let i=0;i<n;i++)s+=document.querySelector(`label[for="b${i}"]`)?.textContent||"";const vals=[...Array(n)].map((_,i)=>document.getElementById("b"+i).value);copyText(title+"\n\n"+vals.map((v,i)=>`${i+1}. ${v}`).join("\n\n"))}
function countText(){const s=document.getElementById("tin").value,w=s.trim()?s.trim().split(/\s+/).length:0,sen=(s.match(/[.!?]+/g)||[]).length,par=s.trim()?s.trim().split(/\n\s*\n/).length:0;document.getElementById("tout").textContent=`${w} words · ${s.length} characters · ${sen} sentences · ${par} paragraphs`}
function textClean(){document.getElementById("tout").value=document.getElementById("tin").value.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}
function caseIt(k){let s=document.getElementById("tin").value;if(k==="upper")s=s.toUpperCase();if(k==="lower")s=s.toLowerCase();if(k==="title")s=s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(k==="sentence")s=s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase());document.getElementById("tout").value=s}
function dedupe(){document.getElementById("tout").value=[...new Set(document.getElementById("tin").value.split(/\r?\n/))].join("\n")}
function sortLines(){document.getElementById("tout").value=document.getElementById("tin").value.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join("\n")}
function slugIt(){document.getElementById("tout").textContent=document.getElementById("tin").value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function formatJSON(){try{document.getElementById("tout").value=JSON.stringify(JSON.parse(document.getElementById("tin").value),null,2);toast("Valid JSON")}catch(e){document.getElementById("tout").value="Invalid JSON: "+e.message}}
function parseCSV(s){const lines=s.trim().split(/\r?\n/),heads=lines.shift().split(",").map(x=>x.trim());return lines.map(l=>{const v=l.split(",");return Object.fromEntries(heads.map((h,i)=>[h,(v[i]||"").trim()]))})}
function csvJSON(){try{document.getElementById("tout").value=JSON.stringify(parseCSV(document.getElementById("tin").value),null,2)}catch(e){document.getElementById("tout").value=e.message}}
function jsonCSV(){try{const a=JSON.parse(document.getElementById("tin").value);if(!Array.isArray(a)||!a.length)throw Error("Use a non-empty array of flat objects.");const h=[...new Set(a.flatMap(Object.keys))];const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;document.getElementById("tout").value=h.map(q).join(",")+"\n"+a.map(o=>h.map(k=>q(o[k])).join(",")).join("\n")}catch(e){document.getElementById("tout").value=e.message}}
function urlCode(enc){try{document.getElementById("tout").value=enc?encodeURIComponent(document.getElementById("tin").value):decodeURIComponent(document.getElementById("tin").value)}catch(e){document.getElementById("tout").value=e.message}}
function b64(enc){try{const v=document.getElementById("tin").value;document.getElementById("tout").value=enc?btoa(unescape(encodeURIComponent(v))):decodeURIComponent(escape(atob(v)))}catch(e){document.getElementById("tout").value=e.message}}
function timestamp(){const v=document.getElementById("tin").value.trim();let d=/^\d+$/.test(v)?new Date(Number(v)*(v.length<=10?1000:1)):new Date(v);document.getElementById("tout").textContent=isNaN(d)?"Invalid input":`${d.toString()} · Unix: ${Math.floor(d.getTime()/1000)}`}
function password(){const len=Math.min(100,Math.max(8,+document.getElementById("plen").value||20)),chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"+(document.getElementById("psym").value==="Yes"?"!@#$%^&*_-+=":"");const a=new Uint32Array(len);crypto.getRandomValues(a);document.getElementById("tout").textContent=[...a].map(x=>chars[x%chars.length]).join("")}
function randomPick(){const a=document.getElementById("tin").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);document.getElementById("tout").textContent=a.length?a[Math.floor(Math.random()*a.length)]:"Add items first."}
function dateDiff(){const a=new Date(document.getElementById("d1").value),b=new Date(document.getElementById("d2").value);document.getElementById("tout").textContent=isNaN(a)||isNaN(b)?"Choose both dates.":`${Math.abs(Math.round((b-a)/86400000))} days`}
function rateCalc(){const r=+document.getElementById("rr").value,h=+document.getElementById("rh").value,c=document.getElementById("rc").value;document.getElementById("tout").innerHTML=`Weekly: <strong>${c} ${(r*h).toFixed(2)}</strong><br>Monthly estimate (52 weeks ÷ 12): <strong>${c} ${(r*h*52/12).toFixed(2)}</strong><br>Annual estimate: <strong>${c} ${(r*h*52).toFixed(2)}</strong>`}
async function convertCurrency(){
 const amount=+document.getElementById("fxamt").value,from=document.getElementById("fxfrom").value,to=document.getElementById("fxto").value,out=document.getElementById("tout");
 if(!(amount>=0))return out.textContent="Enter a valid amount.";
 if(from===to)return out.innerHTML=`<strong>${amount.toLocaleString()} ${from}</strong> = <strong>${amount.toLocaleString()} ${to}</strong>`;
 out.textContent="Fetching latest daily reference rate…";
 try{
  const r=await fetch(`https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(from)}&symbols=${encodeURIComponent(to)}`);
  if(!r.ok)throw Error("Rate service unavailable");
  const d=await r.json(),rate=d.rates?.[to];
  if(!rate)throw Error("Rate unavailable");
  const converted=amount*rate;
  out.innerHTML=`<div class="stat">${converted.toLocaleString(undefined,{maximumFractionDigits:4})} ${to}</div><p><strong>1 ${from}</strong> = ${Number(rate).toLocaleString(undefined,{maximumFractionDigits:6})} ${to}</p><p class="small muted">Reference date: ${esc(d.date||"latest available working day")}</p>`;
 }catch(e){out.innerHTML=`<span class="pill bad">Could not load the exchange rate.</span><p class="small muted">Try again when online.</p>`}
}
function calcConversionRate(){
 const total=+document.getElementById("convtotal").value,done=+document.getElementById("convdone").value,out=document.getElementById("tout");
 if(total<=0||done<0)return out.textContent="Enter valid numbers; total must be greater than 0.";
 const rate=(done/total)*100;
 out.innerHTML=`<div class="stat">${rate.toFixed(2)}%</div><p>${done.toLocaleString()} conversions ÷ ${total.toLocaleString()} total opportunities × 100</p>`;
}
function worldClock(){const z=[["Manila","Asia/Manila"],["New York","America/New_York"],["London","Europe/London"],["Sydney","Australia/Sydney"]];document.getElementById("tout").innerHTML=z.map(([n,t])=>`<div class="list-item"><strong>${n}</strong><br>${new Intl.DateTimeFormat(undefined,{timeZone:t,dateStyle:"medium",timeStyle:"short"}).format(new Date())}</div>`).join("")}
let typeStart,typeTimer;function startTyping(){const i=document.getElementById("typein");i.disabled=false;i.value="";i.focus();typeStart=Date.now();clearTimeout(typeTimer);document.getElementById("tout").textContent="Timer running…";typeTimer=setTimeout(()=>{i.disabled=true;const words=i.value.trim()?i.value.trim().split(/\s+/).length:0;document.getElementById("tout").textContent=`${words} WPM (raw words typed in 60 seconds)`},60000)}
function showColor(){const h=document.getElementById("cpick").value,r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);document.getElementById("tout").innerHTML=`HEX <strong>${h.toUpperCase()}</strong><br>RGB <strong>rgb(${r}, ${g}, ${b})</strong>`}
function gradient(){const a=document.getElementById("g1").value,b=document.getElementById("g2").value,css=`linear-gradient(135deg, ${a}, ${b})`;const o=document.getElementById("tout");o.style.background=css;o.textContent=css}
function drawSocial(){const c=document.getElementById("canvasPreview"),x=c.getContext("2d"),bg=document.getElementById("sbg").value,tc=document.getElementById("stc").value,h=document.getElementById("shead").value,f=document.getElementById("sfoot").value;x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.fillStyle=tc;x.font="bold 70px Arial";x.textAlign="center";wrapCanvas(x,h,540,430,850,90);x.font="28px Arial";x.fillText(f,540,940)}
function wrapCanvas(ctx,text,x,y,max,w){const words=text.split(" "),lines=[];let line="";for(const word of words){const test=line+word+" ";if(ctx.measureText(test).width>max&&line){lines.push(line);line=word+" "}else line=test}lines.push(line);lines.forEach((l,i)=>ctx.fillText(l.trim(),x,y+i*w))}
function downloadCanvas(name){const c=document.getElementById("canvasPreview");const a=document.createElement("a");a.download=name;a.href=c.toDataURL("image/png");a.click()}
function phonePreview(file){if(!file)return;const r=new FileReader();r.onload=()=>document.getElementById("phoneprev").innerHTML=`<img src="${r.result}" alt="Preview">`;r.readAsDataURL(file)}
function resizeImage(){const file=document.getElementById("imgfile").files[0];if(!file)return toast("Choose an image");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=+document.getElementById("imgw").value||1200,scale=Math.min(1,max/im.width),c=document.getElementById("canvasPreview");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const a=document.createElement("a");a.download="resized-image.jpg";a.href=c.toDataURL("image/jpeg",Math.min(1,Math.max(.1,+document.getElementById("imgq").value||.82)));a.click()};im.src=r.result};r.readAsDataURL(file)}
function makeFaviconPreview(){const c=document.getElementById("canvasPreview");if(!c)return;const x=c.getContext("2d");x.fillStyle=document.getElementById("favbg").value;x.fillRect(0,0,64,64);x.fillStyle="#fff";x.font="bold 25px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText(document.getElementById("favtxt").value||"FD",32,32)}
function makeFavicon(){makeFaviconPreview();downloadCanvas("favicon.png")}
function followupDraft(){const c=document.getElementById("tin").value.trim(),n=document.getElementById("nextact").value.trim();document.getElementById("tout").value=`Hi,\n\nFollowing up regarding ${c||"the item we discussed"}. ${n?`Could you please confirm ${n}?`:"Could you please confirm the next step when convenient?"}\n\nThank you.`}
function jobFitBody(desc){return `<p class="small muted">Rule-based local analysis. It does not fabricate experience or pretend to be AI.</p><label>Your skills/tools (comma-separated)</label><input id="skills" class="input" value="${esc((state.data.profile.niches||[]).join(", "))}, Google Workspace, Communication, Research"><label style="margin-top:8px">Job description</label><textarea id="jd">${esc(desc)}</textarea><div id="fitout" class="preview"></div><button class="btn primary" onclick="jobFit()">Analyze</button>`}
function openJobAnalyzer(desc,title){modal(`<div class="cat">JOB FIT ANALYZER</div><h3>${esc(title)}</h3>${jobFitBody(desc)}`)}
function jobFit(){const sk=document.getElementById("skills").value.split(",").map(x=>x.trim()).filter(Boolean),d=document.getElementById("jd").value.toLowerCase();if(!d)return toast("Add a job description");const m=sk.filter(s=>d.includes(s.toLowerCase())),score=Math.round(m.length/Math.max(sk.length,1)*100),exp=/(no experience|entry[- ]level|fresh graduate|training provided|0[-– ]?1 year)/i.test(d),neg=/(negotiable|depending on experience|\bdoe\b|based on experience|based on skills)/i.test(d),red=[];if(/unpaid trial|pay to apply|purchase.*equipment/i.test(d))red.push("Potential payment/trial concern");document.getElementById("fitout").innerHTML=`<div class="stat">${score}% keyword match</div><p><strong>Matched:</strong> ${esc(m.join(", ")||"No exact saved keywords.")}</p><p><strong>Entry-level language:</strong> ${exp?"Explicit phrase detected":"Not explicitly detected"}</p><p><strong>Negotiation language:</strong> ${neg?"Explicit signal detected":"Not explicitly detected"}</p>${red.length?`<p class="pill bad">${red.join(", ")}</p>`:""}<p class="small muted">This score is explainable keyword matching only; it is not a hiring prediction.</p>`}

RISKS / QUESTIONS
• [Risk / unresolved point]

FOLLOW-THROUGH

 <div class="setting-row"><div><h4>Background Tone</h4><p>Warm, Cool or Blush.</p></div><select id="sbg" class="input" onchange="previewAppearance()"><option value="warm" ${s.background==="warm"?"selected":""}>Warm</option><option value="cool" ${s.background==="cool"?"selected":""}>Cool</option><option value="blush" ${s.background==="blush"?"selected":""}>Blush</option></select></div>
 <div class="setting-row"><div><h4>Accent Color</h4><p>Buttons, active nav and progress.</p></div><input id="saccent" type="color" value="${esc(s.accent||"#5b4c78")}" onchange="previewAppearance()"></div>
 <div class="setting-row"><div><h4>Text Size</h4><p>Interface scaling.</p></div><select id="sfont" class="input" onchange="previewAppearance()"><option value=".9" ${Number(s.fontScale)===.9?"selected":""}>Small</option><option value="1" ${Number(s.fontScale)===1?"selected":""}>Default</option><option value="1.1" ${Number(s.fontScale)===1.1?"selected":""}>Large</option><option value="1.2" ${Number(s.fontScale)===1.2?"selected":""}>Extra Large</option></select></div>
 <div class="setting-row"><div><h4>Layout Density</h4><p>Comfortable or compact.</p></div><select id="sdensity" class="input" onchange="previewAppearance()"><option value="comfortable" ${s.density==="comfortable"?"selected":""}>Comfortable</option><option value="compact" ${s.density==="compact"?"selected":""}>Compact</option></select></div>
 <div class="setting-row"><div><h4>Reduced Motion</h4><p>Disable nonessential transitions.</p></div><label><input id="sreduce" type="checkbox" ${s.reducedMotion?"checked":""} onchange="previewAppearance()"> Reduce motion</label></div>
 <div class="setting-row"><div><h4>Start Page</h4><p>Page shown when the workspace opens.</p></div><select id="sstart" class="input">${Object.entries(pages).map(([k,v])=>`<option value="${k}" ${s.startPage===k?"selected":""}>${v}</option>`).join("")}</select></div>
 <button class="btn primary" onclick="saveAppearance()">Save Appearance</button></section>`
}
function previewAppearance(){const s=state.data.settings;s.theme=document.getElementById("stheme").value;s.background=document.getElementById("sbg").value;s.accent=document.getElementById("saccent").value;s.fontScale=+document.getElementById("sfont").value;s.density=document.getElementById("sdensity").value;s.reducedMotion=document.getElementById("sreduce").checked;applySettings()}
function saveAppearance(){previewAppearance();state.data.settings.startPage=document.getElementById("sstart").value;save();toast("Appearance saved")}
function settingsJobPrefs(){const s=state.data.settings;return `<section class="card pad"><h3>Job Preferences</h3><div class="form2"><div><label>Default keyword</label><input id="sjq" class="input" value="${esc(s.jobKeywords||"")}"></div><div><label>Location keyword</label><input id="sjloc" class="input" value="${esc(s.jobLocation||"")}"></div><div><label>Preferred currency</label><input id="scur" class="input" value="${esc(s.currency||"USD")}"></div><div><label>Blocked keywords</label><input id="sblock" class="input" value="${esc(s.blockedKeywords||"")}"></div></div><div class="row" style="margin-top:12px"><label class="pill"><input id="sremote" type="checkbox" ${s.remoteOnly?"checked":""}> Remote preferred</label><label class="pill"><input id="sbeginner" type="checkbox" ${s.beginnerPreferred?"checked":""}> Beginner-friendly</label><label class="pill"><input id="ssalary" type="checkbox" ${s.salaryPreferred?"checked":""}> Salary disclosed</label></div><button class="btn primary" style="margin-top:12px" onclick="saveJobPrefs()">Save Preferences</button></section>`}
function saveJobPrefs(){const s=state.data.settings;s.jobKeywords=document.getElementById("sjq").value;s.jobLocation=document.getElementById("sjloc").value;s.currency=document.getElementById("scur").value;s.blockedKeywords=document.getElementById("sblock").value;s.remoteOnly=document.getElementById("sremote").checked;s.beginnerPreferred=document.getElementById("sbeginner").checked;s.salaryPreferred=document.getElementById("ssalary").checked;save();toast("Job preferences saved")}
function settingsData(){return `<section class="card pad"><h3>Data & Privacy</h3><p class="small muted">Workspace data is stored locally in this browser.</p><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn" onclick="document.getElementById('ifile').click()">Import JSON</button><input id="ifile" type="file" accept=".json,application/json" class="hidden" onchange="importData(this.files[0])"><button class="btn" onclick="clearJobCache()">Clear Job Cache</button><button class="btn bad" onclick="resetAll()">Reset All</button></div></section>`}
function exportData(){const b=new Blob([JSON.stringify({schema:6,exportedAt:new Date().toISOString(),data:state.data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="freelance-desk-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data||o;if(!d||typeof d!=="object")throw Error();if(confirm("Import and merge this backup?")){state.data={...state.data,...d,profile:{...state.data.profile,...(d.profile||{})},settings:{...state.data.settings,...(d.settings||{})}};save();applySettings();render();toast("Backup imported")}}catch{alert("Invalid JSON backup.")}};r.readAsText(f)}
function clearJobCache(){localStorage.removeItem(JOB_CACHE_KEY);state.liveJobs=[];state.sourceHealth={};state.liveStatus="Cache cleared.";toast("Job cache cleared")}
function resetAll(){if(confirm("Delete all locally saved workspace data? Export a backup first if needed.")){localStorage.removeItem(KEY);localStorage.removeItem(JOB_CACHE_KEY);location.reload()}}

function modal(body){document.getElementById("modalRoot").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="x" onclick="closeModal()">×</button>${body}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>toast("Copy failed — select manually"))}

let focusSecs=25*60,focusInt=null,focusRunning=false;
function toggleFocus(){document.getElementById("focus").classList.toggle("hidden");drawFocus()}
function drawFocus(){const e=document.getElementById("focus"),m=String(Math.floor(focusSecs/60)).padStart(2,"0"),s=String(focusSecs%60).padStart(2,"0");e.innerHTML=`<div class="head"><h3>Focus</h3><button class="btn sm" onclick="toggleFocus()">×</button></div><div class="clock">${m}:${s}</div><div class="actions"><button class="btn primary" onclick="runFocus()">${focusRunning?"Pause":"Start"}</button><button class="btn" onclick="resetFocus(25)">25m</button><button class="btn" onclick="resetFocus(50)">50m</button></div><p class="small muted">Completed sessions: ${state.data.focusSessions.length}</p>`}
function runFocus(){focusRunning=!focusRunning;if(focusRunning)focusInt=setInterval(()=>{focusSecs--;if(focusSecs<=0){clearInterval(focusInt);focusRunning=false;state.data.focusSessions.push(new Date().toISOString());save();focusSecs=25*60;toast("Focus session complete")}drawFocus()},1000);else clearInterval(focusInt);drawFocus()}
function resetFocus(m){clearInterval(focusInt);focusRunning=false;focusSecs=m*60;drawFocus()}

function commandIndex(){return [...Object.entries(pages).map(([route,label])=>({label,cat:"Page",desc:"Open "+label,route})),...toolDefs.map(t=>({label:t.n,cat:"Tool",desc:t.d,tool:t.a})),...guideData.map(g=>({label:g.t,cat:"Guide",desc:g.s,guide:g.t})),...workflows.map(([c,t,s])=>({label:t,cat:"Workflow",desc:s,route:"workflows"})),...portfolio.map(([c,t,d])=>({label:t,cat:"Portfolio",desc:d,route:"portfolio"}))]}
function openSearch(){document.getElementById("commandRoot").innerHTML=`<div class="commandbg" onclick="if(event.target===this)closeSearch()"><div class="command"><input id="cmdq" autofocus placeholder="Search pages, tools, guides, workflows…" oninput="cmdResults(this.value)"><div id="cmdres" class="cmdresults"></div></div></div>`;cmdResults("")}
function closeSearch(){document.getElementById("commandRoot").innerHTML=""}
function cmdResults(q){q=q.toLowerCase();const a=commandIndex().filter(x=>!q||(x.label+" "+x.cat+" "+x.desc).toLowerCase().includes(q)).slice(0,35);document.getElementById("cmdres").innerHTML=a.map((x,i)=>`<div class="cmditem" onclick="cmdGo('${encodeURIComponent(JSON.stringify(x))}')"><strong>${esc(x.label)}</strong><div class="small muted">${esc(x.cat)} · ${esc(x.desc)}</div></div>`).join("")||'<div class="empty">No results.</div>'}
function cmdGo(s){const x=JSON.parse(decodeURIComponent(s));closeSearch();if(x.tool)openTool(x.tool);else if(x.guide){navigate("guides");setTimeout(()=>openGuide(encodeURIComponent(x.guide)),20)}else navigate(x.route)}

function render(){
 const r={home:renderHome,desk:renderDesk,community:renderCommunity,jobs:renderJobs,tracker:renderTracker,portfolio:renderPortfolio,tools:renderTools,workflows:renderWorkflows,guides:renderGuides,learn:renderLearn,ai:renderAI,settings:renderSettings}[state.page];
 document.getElementById("content").innerHTML=r();
 if(state.page==="jobs"&&!state.liveJobs.length)setTimeout(()=>loadLiveJobs(false),60);
}
document.getElementById("menu").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("search").onclick=openSearch;
document.getElementById("focusBtn").onclick=toggleFocus;
document.getElementById("assistantBtn").onclick=()=>openAssistant();
document.getElementById("themeBtn").onclick=quickThemeToggle;
document.getElementById("addBtn").onclick=openTask;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch()}if(e.key==="Escape"){closeModal();closeSearch();closeAssistant()}});
load();applySettings();render();
</script>
</body>
</html>
