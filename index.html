.main{min-width:0}.top{height:72px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top-left,.top-actions{display:flex;gap:9px;align-items:center}.mobile{display:none}.top button,.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;color:var(--ink)}.btn:hover,.top button:hover{border-color:#bfb5ad}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.good{background:var(--good);color:#fff;border-color:var(--good)}.btn.bad{color:var(--bad)}.btn.sm{padding:6px 9px;font-size:12px}.content{padding:25px;max-width:1540px;margin:auto}

.hero{display:grid;grid-template-columns:1.45fr 1fr;gap:17px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.pad{padding:20px}.hero .pad{padding:25px}.hero h2{font-size:34px;margin:8px 0}.hero p{margin:0;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.stat{font-size:31px;font-weight:900}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.head h2,.head h3{margin:0}

.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:15px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 11px}textarea{min-height:110px;resize:vertical}label{display:block;font-size:11px;font-weight:800;color:#625d60;margin:0 0 5px}.form2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.list-item{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;margin:8px 0}.list-item h4{margin:0 0 5px}.list-item p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.table{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;background:#faf8f4;color:#7e7675}

.toolgrid,.linkgrid,.guidegrid,.learngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.toolcard,.linkcard,.guidecard{padding:17px}.toolcard h4,.linkcard h4,.guidecard h4{margin:7px 0 5px}.toolcard p,.linkcard p,.guidecard p{font-size:12px;color:var(--muted);min-height:36px}.cat{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--accent)}
.jobfilters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:9px}.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.job{padding:17px}.job h3{font-size:16px;margin:5px 0}.job .company{font-size:12px;color:var(--muted)}.jobdesc{font-size:12px;color:#5e595b;line-height:1.5;margin:10px 0;max-height:58px;overflow:hidden}.jobmeta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.source{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.livebar{padding:12px 14px;background:#eef7f0;border:1px solid #cfe3d5;border-radius:13px;color:#315b40;margin-bottom:13px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.modalbg{position:fixed;inset:0;background:rgba(34,30,31,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:17px}.modal{width:min(800px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:19px;padding:21px;box-shadow:0 30px 90px rgba(0,0,0,.2)}.x{float:right;border:0;background:none;font-size:22px}
.commandbg{position:fixed;inset:0;background:rgba(34,30,31,.45);z-index:110;display:flex;justify-content:center;align-items:flex-start;padding-top:8vh}.command{width:min(720px,94vw);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.2)}.command input{width:100%;padding:17px;border:0;border-bottom:1px solid var(--line);font-size:17px}.cmdresults{max-height:62vh;overflow:auto}.cmditem{padding:12px 16px;border-bottom:1px solid #eee;cursor:pointer}.cmditem:hover{background:#faf7f2}
.toast{position:fixed;right:18px;bottom:18px;background:#272427;color:#fff;padding:11px 14px;border-radius:11px;z-index:150}
.focus{position:fixed;right:17px;top:85px;width:300px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);z-index:70}.clock{font-size:42px;font-weight:900;text-align:center;margin:14px}
.progress{height:7px;background:#e8e2db;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:17px 0}
.sheet{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));overflow:auto;border:1px solid var(--line);border-radius:12px}.cell{min-width:120px;border-right:1px solid #eee;border-bottom:1px solid #eee;padding:7px}.cell input{border:0;width:100%;background:transparent;outline:none}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:88px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}.day strong{font-size:11px}.eventdot{font-size:10px;padding:3px 5px;border-radius:6px;background:var(--accent2);margin-top:4px}
.preview{border:1px dashed var(--line);border-radius:14px;padding:15px;margin-top:12px;background:#fff}

body.dark{--bg:#181719;--panel:#222024;--panel2:#2b282e;--ink:#f1edf1;--muted:#aaa1aa;--line:#3b373e;--shadow:0 10px 28px rgba(0,0,0,.25)}
body.cool{--bg:#f2f5f6;--panel:#ffffff;--panel2:#e9eef0;--line:#d5dde0}
body.blush{--bg:#faf2f3;--panel:#fffafb;--panel2:#f3e6e8;--line:#e6d3d7}
body.compact .pad{padding:15px} body.reduced *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.roomlayout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.roomlist{max-height:650px;overflow:auto}.roomitem{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel);cursor:pointer}.roomitem.active{border-color:var(--accent);background:var(--surface-2)}.chatbox{display:flex;flex-direction:column;min-height:610px}.messages{flex:1;overflow:auto;max-height:460px}.message{padding:10px 12px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:var(--panel2)}.message.mine{border-left:3px solid var(--accent)}.message.pinned{border-color:var(--warn)}
.vaultgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.doccard{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px}.docmeta{font-size:10px;color:var(--muted);word-break:break-word}.fitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.fitmetric{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel)}.fitmetric strong{font-size:22px;display:block}.evidence{border-left:3px solid var(--accent);padding:9px 11px;background:var(--surface-2);border-radius:0 10px 10px 0;margin:7px 0;font-size:12px}.kitarea{min-height:260px;line-height:1.55}
.drawerbg{position:fixed;inset:0;background:rgba(25,22,25,.35);z-index:80}.assistant{position:fixed;right:0;top:0;bottom:0;width:min(480px,96vw);z-index:90;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.18);padding:18px;overflow:auto}.assistant-output{min-height:310px;white-space:pre-wrap;line-height:1.6}
.setting-row{display:grid;grid-template-columns:220px 1fr;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.setting-row h4{margin:0}.setting-row p{margin:3px 0;color:var(--muted);font-size:12px}.step{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:var(--panel)}.rubric{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quizopt{display:block;padding:9px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.projectgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.projectcard{padding:17px}

.manual-analyzer{border:2px solid var(--accent);box-shadow:0 12px 34px color-mix(in srgb,var(--accent) 12%,transparent)}
.verdict{font-size:24px;font-weight:900;margin:4px 0}

.analysis-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

<style>
.auth-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--ink)}
.auth-box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:32px 28px}
.auth-header{text-align:center;margin-bottom:24px}
.auth-header .brandmark{margin:0 auto 12px;width:52px;height:52px;font-size:22px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}
.auth-header h2{font-size:22px;margin:8px 0 4px}
.auth-header p{font-size:13px;color:var(--muted);margin:0}
.auth-tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;margin-bottom:20px}
.auth-tab{flex:1;border:0;background:none;padding:9px 6px;font-size:12px;font-weight:800;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .15s}
.auth-tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.auth-btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:18px;font-size:13px}
.auth-btn-google:hover{background:var(--panel2);border-color:#bfb5ad}
.auth-divider{display:flex;align-items:center;text-align:center;margin:18px 0;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.auth-divider::before,.auth-divider::after{content:'';flex:1;border-bottom:1px solid var(--line)}
.auth-divider::before{margin-right:12px}

.user-badge .pill{font-size:9px;padding:4px 7px}.auth-box .actions{display:flex;gap:8px;flex-wrap:wrap}
</style>

// --- Shared Community realtime runtime state (not private workspace data) ---
const communityState = {
  rooms: [],
  loading: true,
  error: "",
  joined: false,
  joining: false,
  messages: [],
  resources: [],
  members: [],
  roomsUnsub: null,
  messagesUnsub: null,
  resourcesUnsub: null,
  membersUnsub: null
};

function communityMaybeRender(){
  if (state.page === "community" && authState && authState.user) render();
}
function stopActiveRoomRealtime(){
  ["messagesUnsub","resourcesUnsub","membersUnsub"].forEach(k=>{
    try { if (typeof communityState[k] === "function") communityState[k](); } catch(e){}
    communityState[k] = null;
  });
  communityState.messages = [];
  communityState.resources = [];
  communityState.members = [];
  communityState.joined = false;
  communityState.joining = false;
}
function stopCommunityRealtime(){
  stopActiveRoomRealtime();
  try { if (typeof communityState.roomsUnsub === "function") communityState.roomsUnsub(); } catch(e){}
  communityState.roomsUnsub = null;
  communityState.rooms = [];
  communityState.loading = false;
  communityState.error = "";
  state.activeRoom = null;
}
function startCommunityRealtime(){
  if (!db || !auth || !auth.currentUser || authState?.accessStatus !== "approved") return;
  if (typeof communityState.roomsUnsub === "function") communityState.roomsUnsub();
  communityState.loading = true;
  communityState.error = "";
  communityState.roomsUnsub = db.collection("rooms")
    .where("visibility", "==", "public")
    .onSnapshot(snap => {
      communityState.rooms = snap.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0));
      communityState.loading = false;
      if (state.activeRoom && !communityState.rooms.some(r=>r.id===state.activeRoom)) {
        stopActiveRoomRealtime();
        state.activeRoom = null;
      }
      communityMaybeRender();
    }, err => {
      console.error("Community room list error:", err);
      communityState.loading = false;
      communityState.error = err.message || "Unable to load community rooms.";
      communityMaybeRender();
    });
}
function communityUserName(){
  const u = authState?.user;
  return state.data.profile?.name || u?.displayName || (u?.email ? u.email.split("@")[0] : "Member");
}
function communityUserPhoto(){ return authState?.user?.photoURL || ""; }
function roomById(id){ return communityState.rooms.find(r=>r.id===id); }
function roomDate(v){
  if (!v) return "";
  try {
    if (typeof v.toDate === "function") return v.toDate().toLocaleString();
    return new Date(v).toLocaleString();
  } catch { return ""; }
}
function activeRoomIsOwner(){
  return !!(authState?.user && roomById(state.activeRoom)?.ownerId === authState.user.uid);
}
function currentPlatformRole(){ return authState?.platformRole || "member"; }
function platformRoleLabel(role){ return ({owner:"Owner / Super Admin",admin:"Admin",moderator:"Moderator",member:"Member"})[role] || "Member"; }
function accessStatusLabel(status){ return ({approved:"Approved",pending:"Pending Approval",blocked:"Blocked",checking:"Checking…",error:"Access Check Error"})[status] || "Unknown"; }
function canManagePlatformUsers(){ return ["owner","admin"].includes(currentPlatformRole()); }
function platformCanModerateCommunity(){ return ["owner","admin","moderator"].includes(currentPlatformRole()); }
function platformCanManageRooms(){ return ["owner","admin"].includes(currentPlatformRole()); }
function activeRoomMembership(uidValue){
  const id = uidValue || authState?.user?.uid;
  return communityState.members.find(m => (m.uid || m.id) === id) || null;
}
function activeRoomMemberRole(uidValue){ return activeRoomMembership(uidValue)?.role || "member"; }
function activeRoomCanModerate(){
  return activeRoomIsOwner() || activeRoomMemberRole() === "moderator" || platformCanModerateCommunity();
}

const PRIVATE_WORKSPACE_ARRAY_KEYS = [
  "tasks","events","links","snippets","clients","invoices","notes","sheet","jobs",
  "externalCommunities","customProjects","favorites","focusSessions"
];
const PRIVATE_WORKSPACE_OBJECT_KEYS = [
  "learning","learningProgress","portfolio","portfolioProgress","preferences","templateDrafts","academy"
];

function privateWorkspacePayload(){
  const payload = {
    profile: state.data.profile,
    settings: state.data.settings,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  PRIVATE_WORKSPACE_ARRAY_KEYS.forEach(key => { payload[key] = state.data[key]; });
  PRIVATE_WORKSPACE_OBJECT_KEYS.forEach(key => { payload[key] = state.data[key]; });
  return payload;
}

function applyCloudWorkspace(workspace){
  if (!workspace || typeof workspace !== "object") return;

  if (workspace.profile) {
    state.data.profile = { ...state.data.profile, ...workspace.profile };
  }
  if (workspace.settings) {
    state.data.settings = { ...state.data.settings, ...workspace.settings };
  }

  PRIVATE_WORKSPACE_ARRAY_KEYS.forEach(key => {
    if (Array.isArray(workspace[key])) state.data[key] = workspace[key];
  });

  PRIVATE_WORKSPACE_OBJECT_KEYS.forEach(key => {
    if (workspace[key] && typeof workspace[key] === "object" && !Array.isArray(workspace[key])) {
      state.data[key] = { ...state.data[key], ...workspace[key] };
    }
  });
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(state.data));

  if (typeof auth !== "undefined" && auth && auth.currentUser && db) {
    db.collection("users").doc(auth.currentUser.uid).set({
      workspace: privateWorkspacePayload()
    }, { merge: true })
    .catch(err => console.error("Cloud sync error:", err));
  }
}

function syncCareerDocToCloud(doc){
  if (!doc || typeof auth === "undefined" || !auth || !auth.currentUser || !db) return;
  db.collection("users").doc(auth.currentUser.uid)
    .collection("careerDocuments").doc(doc.id).set(doc, { merge: true })
    .catch(err => console.error("Career document cloud sync error:", err));
}

function deleteCareerDocFromCloud(id){
  if (!id || typeof auth === "undefined" || !auth || !auth.currentUser || !db) return;
  db.collection("users").doc(auth.currentUser.uid)
    .collection("careerDocuments").doc(id).delete()
    .catch(err => console.error("Career document cloud delete error:", err));
}

function syncApplicationKitToCloud(kit){
  if (!kit || typeof auth === "undefined" || !auth || !auth.currentUser || !db) return;
  db.collection("users").doc(auth.currentUser.uid)
    .collection("applicationKits").doc(kit.id).set(kit, { merge: true })
    .catch(err => console.error("Application kit cloud sync error:", err));
}

async function createRoom(){
 if(!db||!auth?.currentUser)return toast("Please sign in first");
 const name=document.getElementById("rname").value.trim();if(!name)return toast("Name the room");
 const roomRef=db.collection("rooms").doc();
 const payload={name,type:document.getElementById("rtype").value,purpose:document.getElementById("rpurpose").value.trim(),visibility:"public",ownerId:auth.currentUser.uid,ownerName:communityUserName(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdAtMs:Date.now(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
 try{
  await roomRef.set(payload);
  await roomRef.collection("members").doc(auth.currentUser.uid).set({uid:auth.currentUser.uid,displayName:communityUserName(),photoURL:communityUserPhoto(),role:"owner",joinedAt:firebase.firestore.FieldValue.serverTimestamp(),joinedAtMs:Date.now()});
  closeModal();state.activeRoom=roomRef.id;communityState.joined=true;attachActiveRoomRealtime(roomRef.id);toast("Shared room created");
 }catch(err){console.error("Create room error:",err);showCommunityError("Could Not Create Room",err);}
}

async function joinActiveRoom(){
 const id=state.activeRoom, room=roomById(id), user=auth?.currentUser;
 if(!id||!room||!user||!db)return;
 if(communityState.joining)return;
 communityState.joining=true;communityMaybeRender();
 const memberRef=db.collection("rooms").doc(id).collection("members").doc(user.uid);
 try{
  // A first visit creates membership. If the member already exists, the current rules may reject this update;
  // that permission error is harmless because the existing membership already grants room access.
  await memberRef.set({uid:user.uid,displayName:communityUserName(),photoURL:communityUserPhoto(),role:room.ownerId===user.uid?"owner":"member",joinedAt:firebase.firestore.FieldValue.serverTimestamp(),joinedAtMs:Date.now()});
 }catch(err){
  if(err?.code!=="permission-denied"){
    communityState.joining=false;communityState.error=err.message||"Unable to join room.";communityMaybeRender();return;
  }
 }
 communityState.joining=false;communityState.joined=true;attachActiveRoomRealtime(id);communityMaybeRender();
}
function attachActiveRoomRealtime(id){
 stopActiveRoomRealtime();
 communityState.joined=true;
 const roomRef=db.collection("rooms").doc(id);
 communityState.messagesUnsub=roomRef.collection("messages").onSnapshot(snap=>{
  communityState.messages=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAtMs||0)-(b.createdAtMs||0));communityMaybeRender();
 },err=>{console.error("Room messages error:",err);communityState.error=err.message||"Unable to read room messages.";communityMaybeRender();});
 communityState.resourcesUnsub=roomRef.collection("resources").onSnapshot(snap=>{
  communityState.resources=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0));communityMaybeRender();
 },err=>console.error("Room resources error:",err));
 communityState.membersUnsub=roomRef.collection("members").onSnapshot(snap=>{
  communityState.members=snap.docs.map(d=>({id:d.id,...d.data()}));communityMaybeRender();
 },err=>console.error("Room members error:",err));
}

function inferJob(j){
 const text=(j.title+" "+j.description+" "+(j.level||"")).toLowerCase();
 const explicitEntry=/(no experience|required no experience|entry[- ]level|fresh graduate|fresh graduates|0[-– ]?1 year|junior|training provided|career shifter)/i.test(text);
 const senior=/(senior|lead |manager|director|head of|principal|staff engineer|5\+ years|7\+ years|10\+ years)/i.test(text);
 const possibleEntry=!senior && /(assistant|associate|coordinator|support|junior|intern|trainee)/i.test(text);
 const negotiationExplicit=/(negotiable|depending on experience|\bdoe\b|based on experience|based on skills)/i.test(text);
 const negotiationPossible=!negotiationExplicit && (!!j.salaryMin&&!!j.salaryMax&&j.salaryMax>j.salaryMin);
 const red=[];
 if(/unpaid trial|pay to apply|payment.*training|purchase.*equipment.*before|telegram only|crypto payment/i.test(text))red.push("Review unusual payment/trial language");
 return {...j,entryFlag:explicitEntry?"VERIFIED":possibleEntry?"POSSIBLE":"",negFlag:negotiationExplicit?"EXPLICIT":negotiationPossible?"POSSIBLE":"",red};
}
async function loadLiveJobs(force=false){
 const status=document.getElementById("liveStatus");if(status)status.textContent="Loading free/public job feeds…";
 try{
  const cached=JSON.parse(localStorage.getItem(JOB_CACHE_KEY)||"null");
  if(!force&&cached&&Date.now()-cached.time<DAY){
    state.liveJobs=cached.jobs.map(inferJob);
    state.sourceHealth=cached.sourceHealth||{};
    state.liveStatus=`Using 24-hour cache · last refreshed ${new Date(cached.time).toLocaleString()}`;
    render();return
  }
 }catch(e){}
 const results=[],health={};

 try{
  const r=await fetch("https://jobicy.com/api/v2/remote-jobs?count=100");
  if(!r.ok)throw new Error("Jobicy HTTP "+r.status);
  const d=await r.json();

function filteredLiveJobs(){

 if(date==="Last 24 hours")maxAge=1;

 });

const FIT_SKILLS=["google workspace","gmail","google calendar","google sheets","google docs","microsoft office","excel","word","powerpoint","outlook","canva","capcut","photoshop","figma","notion","clickup","trello","asana","slack","zoom","calendly","loom","hubspot","salesforce","gohighlevel","mailchimp","manychat","zapier","make.com","n8n","shopify","woocommerce","amazon","quickbooks","xero","bookkeeping","data entry","crm","lead generation","prospecting","cold email","calendar management","inbox management","email management","travel planning","meeting coordination","executive support","administrative support","project management","operations","sop","research","market research","customer support","customer service","community management","social media management","content creation","content scheduling","copywriting","seo","google analytics","meta business suite","facebook ads","google ads","recruitment","candidate sourcing","interview scheduling","onboarding","real estate","property management","transaction coordination","wordpress","webflow","html","css","javascript","python","sql","data analysis","communication","time management","organization","attention to detail"];
const FIT_STOP=new Set("the and for with that this from your you are our their have has had will would should could can may into about job role work working required requirements preferred plus team company candidate candidates responsibilities responsibility skills skill experience years year remote position looking must using use used support".split(" "));
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9+#. ]+/g," ").replace(/\s+/g," ").trim()}
function fitKeywords(text){const low=norm(text),skills=FIT_SKILLS.filter(x=>low.includes(x)),words=low.split(" ").filter(w=>w.length>3&&!FIT_STOP.has(w)),freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);return{skills:[...new Set(skills)],common:Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,20).map(x=>x[0])}}

function familyMatches(text){const low=norm(text);return FIT_FAMILIES.filter(f=>f.terms.some(t=>low.includes(norm(t))))}
function extractHardSignals(text){
 const low=String(text||"").toLowerCase(),yrs=[...low.matchAll(/(\d+)\s*(?:\+|plus)?\s*(?:years?|yrs?)(?:\s+of)?\s+(?:experience|exp)/g)].map(x=>+x[1]),s=[];
 if(/graveyard|night shift|us hours|est hours|pst hours|cst hours/.test(low))s.push("US / night-shift schedule mentioned");
 if(/uk hours|gmt/.test(low))s.push("UK/GMT schedule mentioned");
 if(/australia|australian hours|aest/.test(low))s.push("AU schedule mentioned");
 if(/philippines only|philippines-based|filipino|philippine/.test(low))s.push("Philippines eligibility mentioned");
 if(/us only|united states only|must reside in the us/.test(low))s.push("US-only location requirement");

}
function yearsEvidence(text){
 if(!text)return null;
 const low=String(text).toLowerCase(),matches=[...low.matchAll(/(\d+)\s*(?:\+|plus)?\s*(?:years?|yrs?)(?:\s+of)?\s+(?:experience|exp)/g)];
 if(!matches.length)return null;
 const nums=matches.map(x=>+x[1]).filter(n=>!isNaN(n));
 return nums.length?Math.max(...nums):null;
}

 if(!profileNames.has("Project / Task Management")&&/(coordinate|organize|track|deadline|project)/i.test(jobText)&&/(operations|manager|supervis|admin)/i.test(corpus))transferable.push("Your operations/admin experience may transfer to project coordination.");
 if(!profileNames.has("Customer Support")&&/(customer|client|support)/i.test(jobText)&&/(customer|client|communication)/i.test(corpus))transferable.push("Your client/customer-facing experience may transfer to support work.");
 if(!profileNames.has("Executive Support")&&/(executive assistant|executive support|founder|ceo)/i.test(jobText)&&/(manager|operations|administrative support|office)/i.test(corpus))transferable.push("Your management/admin background may transfer to executive support, but executive-level ownership should be verified.");
 if(!profileNames.has("CRM")&&/\bcrm\b/i.test(jobText)&&/(lead|contact|tracker|pipeline|database)/i.test(corpus))transferable.push("Your lead/contact tracking experience may transfer to CRM work; the specific platform still needs verification.");

function builder(fields,title){return fields.map((f,i)=>`<label>${f}</label><textarea id="b${i}"></textarea>`).join("")+`<button class="btn primary" onclick="copyBuilder(${fields.length},'${title}')">Copy Structured Output</button>`}
function copyBuilder(n,title){let s=title+"\n\n";for(let i=0;i<n;i++)s+=document.querySelector(`label[for="b${i}"]`)?.textContent||"";const vals=[...Array(n)].map((_,i)=>document.getElementById("b"+i)?.value||"");copyText(title+"\n\n"+vals.map((v,i)=>`${i+1}. ${v}`).join("\n\n"))}
function countText(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(!tin||!tout)return;const s=tin.value,w=s.trim()?s.trim().split(/\s+/).length:0,sen=(s.match(/[.!?]+/g)||[]).length,par=s.trim()?s.trim().split(/\n\s*\n/).length:0;tout.textContent=`${w} words · ${s.length} characters · ${sen} sentences · ${par} paragraphs`}
function textClean(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(tin&&tout)tout.value=tin.value.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}
function caseIt(k){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(!tin||!tout)return;let s=tin.value;if(k==="upper")s=s.toUpperCase();if(k==="lower")s=s.toLowerCase();if(k==="title")s=s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(k==="sentence")s=s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase());tout.value=s}
function dedupe(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(tin&&tout)tout.value=[...new Set(tin.value.split(/\r?\n/))].join("\n")}
function sortLines(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(tin&&tout)tout.value=tin.value.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join("\n")}
function slugIt(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(tin&&tout)tout.textContent=tin.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}

function parseCSV(s){const lines=s.trim().split(/\r?\n/),heads=lines.shift().split(",").map(x=>x.trim());return lines.map(l=>{const v=l.split(",");return Object.fromEntries(heads.map((h,i)=>[h,(v[i]||"").trim()]))})}
function csvJSON(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(!tin||!tout)return;try{tout.value=JSON.stringify(parseCSV(tin.value),null,2)}catch(e){tout.value=e.message}}
function jsonCSV(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(!tin||!tout)return;try{const a=JSON.parse(tin.value);if(!Array.isArray(a)||!a.length)throw Error("Use a non-empty array of flat objects.");const h=[...new Set(a.flatMap(Object.keys))];const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;tout.value=h.map(q).join(",")+"\n"+a.map(o=>h.map(k=>q(o[k])).join(",")).join("\n")}catch(e){tout.value=e.message}}

function password(){const tout=document.getElementById("tout");if(!tout)return;const plen=document.getElementById("plen"),psym=document.getElementById("psym");const len=Math.min(100,Math.max(8,+(plen?.value)||20)),chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"+((psym?.value)==="Yes"?"!@#$%^&*_-+=":"");const a=new Uint32Array(len);crypto.getRandomValues(a);tout.textContent=[...a].map(x=>chars[x%chars.length]).join("")}
function randomPick(){const tin=document.getElementById("tin"),tout=document.getElementById("tout");if(!tin||!tout)return;const a=tin.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);tout.textContent=a.length?a[Math.floor(Math.random()*a.length)]:"Add items first."}

async function convertCurrency(){
 const amtEl=document.getElementById("fxamt"),fromEl=document.getElementById("fxfrom"),toEl=document.getElementById("fxto"),out=document.getElementById("tout");
 if(!out)return;
 const amount=+(amtEl?.value||0),from=fromEl?.value||"USD",to=toEl?.value||"PHP";
 if(!(amount>=0))return out.textContent="Enter a valid amount.";
 if(from===to)return out.innerHTML=`<strong>${amount.toLocaleString()} ${from}</strong> = <strong>${amount.toLocaleString()} ${to}</strong>`;
 out.textContent="Fetching latest daily reference rate…";
 try{
  const r=await fetch(`https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(from)}&symbols=${encodeURIComponent(to)}`);
  if(!r.ok)throw Error("Rate service unavailable");
  const d=await r.json(),rate=d.rates?.[to];
  if(!rate)throw Error("Rate unavailable");
  const converted=amount*rate;
  out.innerHTML=`<div class="stat">${converted.toLocaleString(undefined,{maximumFractionDigits:4})} ${to}</div><p><strong>1 ${from}</strong> = ${Number(rate).toLocaleString(undefined,{maximumFractionDigits:6})} ${to}</p><p class="small muted">Reference date: ${esc(d.date||"latest available working day")}</p>`;
 }catch(e){out.innerHTML=`<span class="pill bad">Could not load the exchange rate.</span><p class="small muted">Try again when online.</p>`}
}
function calcConversionRate(){
 const total=+(document.getElementById("convtotal")?.value||0),done=+(document.getElementById("convdone")?.value||0),out=document.getElementById("tout");
 if(!out)return;
 if(total<=0||done<0)return out.textContent="Enter valid numbers; total must be greater than 0.";
 const rate=(done/total)*100;
 out.innerHTML=`<div class="stat">${rate.toFixed(2)}%</div><p>${done.toLocaleString()} conversions ÷ ${total.toLocaleString()} total opportunities × 100</p>`;
}

function generateDeskMate(){
 const mode=document.getElementById("dmMode").value,c=document.getElementById("dmContext").value.trim(),note=document.getElementById("dmInstruction").value.trim(),p=state.data.profile;
 let out="";
 if(mode==="Cover Letter"){
  const a=evidenceFitAnalysis(c,{title:"Advertised Role",description:c}),match=a.matchedSkills.slice(0,6).join(", ")||"the relevant experience shown in my saved materials";
  out=`Dear Hiring Team,

I am applying for the advertised opportunity. After reviewing the role against my saved career materials, the strongest areas of alignment include ${match}.

My background includes experience and transferable skills relevant to the responsibilities described. I would bring a structured approach to communication, organization, research and follow-through while remaining transparent about any requirements I am still developing.

I would welcome the opportunity to discuss how my actual experience can support your team.

Sincerely,
${p.name||"Applicant"}`
 } else if(mode==="Application Email"){
  const a=evidenceFitAnalysis(c,{title:"Advertised Role",description:c}),match=a.matchedSkills.slice(0,5).join(", ")||"the role's core responsibilities";
  out=`Subject: Application — Advertised Role

Hello,

I’m reaching out regarding your opening. My background aligns most clearly with ${match}. I reviewed the role carefully and would be glad to discuss how my experience can support the team.

Portfolio: ${p.portfolioUrl||"[insert portfolio link]"}
Resume: [attach resume]

Thank you,
${p.name||"Applicant"}`
 } else if(mode==="Client Reply"){
  out=`Hi,

Thanks for the message. I want to make sure I handle this in the right order.

My understanding:
• ${c||"[client request]"}
• I can complete the highest-priority item first.
• If the additional request changes scope or timing, I’ll flag the impact before committing.

Could you confirm which outcome should take priority?

Thank you.`
 } else if(mode==="Follow-Up"){
  out=`Hi,

Following up regarding ${c||"the pending item"}. I’m ready to move forward once the needed confirmation is available.

Could you please confirm the next step or expected approval timeline so I can keep the work on schedule?

Thank you.`
 } else if(mode==="SOP"){
  out=`STANDARD OPERATING PROCEDURE

PROCESS
${c||"[Process / context]"}

PURPOSE
Create a consistent and repeatable way to complete this process.

TRIGGER
The process begins when the required request, event or input is received.

STEPS
1. Confirm the input is complete.
2. Record it in the correct tracker/system.
3. Verify required details.
4. Complete the authorized action.
5. Flag exceptions, risks or missing information.
6. Update owner, status and due date.
7. Confirm completion and close the loop.

QUALITY CHECKS
• Required information is complete.
• No duplicate action exists.
• Exceptions are escalated.
• Final status is documented.`
 } else if(mode==="Meeting Brief"){
  out=`MEETING BRIEF

OBJECTIVE
${c||"[Define the desired decision or outcome.]"}

BACKGROUND
Summarize only the context attendees need.

ATTENDEES
[Names / roles]

KEY FACTS
• [Fact 1]
• [Fact 2]
• [Constraint / deadline]

DECISIONS NEEDED
1. [Decision]

RISKS / QUESTIONS
• [Risk / unresolved point]

FOLLOW-THROUGH
Document the decision, owner and due date immediately after the meeting.`
 } else if(mode==="Social Caption"){
  out=`HOOK
A clearer system usually removes more stress than another productivity trick.

CAPTION
${c||"A common business problem is work getting lost between people, tools and deadlines."}

Instead of relying on memory, define the next action, owner and deadline. That one habit makes handoffs easier to follow and makes problems easier to spot before they become urgent.

PRACTICAL TAKEAWAY
Before closing a task, ask: What happens next, who owns it, and by when?

QUESTION
Which part of your workflow needs a clearer next step?`
 } else if(mode==="Portfolio Case Study"){
  out=`SIMULATED PORTFOLIO CASE STUDY

PROJECT CONTEXT
${c||"[Describe your simulated project.]"}

PROBLEM
What needed to be organized, improved or created?

APPROACH
1. Defined the desired outcome.
2. Mapped the required information/process.
3. Built the deliverable using appropriate tools.
4. Reviewed accuracy and usability.

DELIVERABLE
[Describe what you created.]

WHAT THIS DEMONSTRATES
Organization, judgment, communication, documentation and follow-through.

DISCLOSURE
This is a simulated portfolio project and does not represent paid client work.`
 } else if(mode==="Job Fit Summary"){
  const a=evidenceFitAnalysis(c,{title:"Pasted Job",description:c});
  out=`JOB FIT SUMMARY

Evidence Fit: ${a.score}% — ${a.label}
Confidence: ${a.confidence}

MATCHED SKILLS
${a.matchedSkills.map(x=>"• "+x).join("\n")||"• No exact stored skill phrases detected"}

GAPS / VERIFY
${a.missingSkills.slice(0,10).map(x=>"• "+x).join("\n")||"• No exact skill gaps detected"}

ELIGIBILITY
${a.locNote}

NEXT STEP
${a.score>=75?"Strong evidence match: tailor an application using verified experience only.":a.score>=55?"Possible fit: review required vs preferred gaps.":"Weak/unclear match: prioritize stronger-fit roles unless you can truthfully address the gaps."}`
 }
 if(note)out+=`\n\nSTYLE / USER NOTE\n${note}`;
 document.getElementById("dmOutput").value=out
}

function profileCompleteness(){
 const p=state.data.profile||{},checks=[
  ["Name",p.name&&p.name!=="Friend"],["Professional title",p.title],["Headline",p.headline],["Career stage",p.level],
  ["Niche",Array.isArray(p.niches)&&p.niches.length],["Target client",p.targetClients],["USP",p.usp],["About",p.about],
  ["Services",p.services],["Skills & tools",p.skills],["Availability",p.availability||p.weeklyHours],["Portfolio / professional link",p.portfolioUrl||p.linkedinUrl||p.onlineJobsUrl||p.upworkUrl||p.websiteUrl]
 ];
 const done=checks.filter(x=>!!x[1]).length,score=Math.round(done/checks.length*100);
 return {score,missing:checks.filter(x=>!x[1]).map(x=>x[0]),done,total:checks.length};
}

function settingsAccessRoles(){
 const role=currentPlatformRole(), status=authState?.accessStatus||"approved", canManage=canManagePlatformUsers();
 if(canManage && !authState.accessUsersLoaded && !authState.accessUsersLoading){setTimeout(()=>loadAccessUsers(),0)}
 const ownerNote=role==="owner"
  ? `<div class="auth-alert success"><span>✓</span><div>You are the platform owner. You can approve access and manage platform roles.</div></div>`
  : role==="admin"
    ? `<div class="auth-alert success"><span>✓</span><div>You can approve or block users and manage Member/Moderator roles. Owner controls remain protected.</div></div>`
    : `<div class="livebar">Your account is approved as <strong>${esc(platformRoleLabel(role))}</strong>. User approval controls are available only to Owner/Admin accounts.</div>`;
 return `<section class="card pad" style="margin-bottom:16px">
   <div class="head"><div><div class="cat">ACCOUNT ACCESS</div><h3 style="margin:6px 0 3px">Your Access & Platform Role</h3></div><div class="row"><span class="pill ${status==='approved'?'good':status==='blocked'?'bad':'warn'}">${esc(accessStatusLabel(status))}</span><span class="pill">${esc(platformRoleLabel(role))}</span></div></div>
   ${ownerNote}
   <p class="small muted">Platform roles are separate from room roles. Owner/Admin manage platform access; Moderator supports community moderation; Member uses the workspace normally. Room Owner/Moderator/Member permissions apply only inside a room.</p>
  </section>
  ${canManage?`<section class="card pad"><div class="head"><div><div class="cat">APPROVED USER CONTROL</div><h3 style="margin:6px 0 3px">Users & Access Requests</h3><p class="small muted">New accounts are Pending until an Owner/Admin approves them.</p></div><button class="btn" onclick="loadAccessUsers(true)">↻ Refresh</button></div><div id="accessUserList">${renderAccessUsers()}</div></section>`:''}`;
}
function renderAccessUsers(){
 if(authState.accessUsersLoading)return `<div class="empty">Loading users…</div>`;
 if(authState.accessUsersError)return `<div class="auth-alert error"><span>⚠️</span><div>${esc(authState.accessUsersError)}</div></div>`;
 const rows=Array.isArray(authState.accessUsers)?authState.accessUsers:[];
 if(!rows.length)return `<div class="empty">No user records loaded yet.</div>`;
 const me=authState.user?.uid, myRole=currentPlatformRole();
 return `<div class="table"><table style="min-width:920px"><thead><tr><th>User</th><th>Status</th><th>Platform Role</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>{
   const uidValue=u.uid||u.id||"", targetRole=u.platformRole||"member", targetStatus=u.accessStatus||"pending", isSelf=uidValue===me;
   const protectedForAdmin=myRole==="admin" && ["owner","admin"].includes(targetRole);
   const manageable=!isSelf && !protectedForAdmin;
   const roleOptions=(myRole==="owner"?["member","moderator","admin","owner"]:["member","moderator"]).map(r=>`<option value="${r}" ${targetRole===r?'selected':''}>${esc(platformRoleLabel(r))}</option>`).join("");
   return `<tr><td><strong>${esc(u.displayName||u.email||"User")}</strong><div class="tiny muted">${esc(u.email||"")}</div><div class="tiny muted" style="font-family:monospace">${esc(uidValue)}</div>${isSelf?'<span class="pill good" style="margin-top:5px">YOU</span>':''}</td><td><span class="pill ${targetStatus==='approved'?'good':targetStatus==='blocked'?'bad':'warn'}">${esc(accessStatusLabel(targetStatus))}</span></td><td>${manageable?`<select class="input" style="min-width:160px" onchange="setPlatformUserRole('${esc(uidValue)}',this.value)">${roleOptions}</select>`:`<span class="pill">${esc(platformRoleLabel(targetRole))}</span>`}</td><td>${esc(roomDate(u.lastLogin)||'—')}</td><td>${manageable?`<div class="actions"><button class="btn sm good" onclick="setPlatformUserAccess('${esc(uidValue)}','approved')">Approve</button><button class="btn sm" onclick="setPlatformUserAccess('${esc(uidValue)}','pending')">Pending</button><button class="btn sm bad" onclick="setPlatformUserAccess('${esc(uidValue)}','blocked')">Block</button></div>`:'<span class="tiny muted">Protected / current account</span>'}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
async function loadAccessUsers(force=false){
 if(!db||!auth?.currentUser||!canManagePlatformUsers())return;
 if(authState.accessUsersLoading&&!force)return;
 authState.accessUsersLoading=true;authState.accessUsersError="";
 if(state.page==="settings"&&state.settingsTab==="Access & Roles")render();
 try{
  const snap=await db.collection("users").limit(200).get();
  authState.accessUsers=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.email||a.displayName||"").localeCompare(String(b.email||b.displayName||"")));
  authState.accessUsersLoaded=true;
 }catch(err){console.error("Access user list error:",err);authState.accessUsersError=err.message||"Unable to load user access records."}
 finally{authState.accessUsersLoading=false;if(state.page==="settings"&&state.settingsTab==="Access & Roles")render()}
}
function accessUserRecord(uidValue){return (authState.accessUsers||[]).find(u=>(u.uid||u.id)===uidValue)}
function canManageAccessTarget(target){
 if(!target||target.uid===authState.user?.uid||target.id===authState.user?.uid)return false;
 if(currentPlatformRole()==="owner")return true;
 return currentPlatformRole()==="admin" && !["owner","admin"].includes(target.platformRole||"member");
}
async function setPlatformUserAccess(uidValue,status){
 if(!["approved","pending","blocked"].includes(status)||!db||!canManagePlatformUsers())return;
 const target=accessUserRecord(uidValue);if(!canManageAccessTarget(target))return toast("That account is protected");
 try{
  await db.collection("users").doc(uidValue).set({accessStatus:status,accessUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),accessUpdatedBy:auth.currentUser.uid},{merge:true});
  toast(`Access set to ${accessStatusLabel(status)}`);await loadAccessUsers(true);
 }catch(err){console.error("Update access error:",err);alert("Could not update access: "+(err.message||err))}
}
async function setPlatformUserRole(uidValue,role){
 const allowed=["owner","admin","moderator","member"];if(!allowed.includes(role)||!db||!canManagePlatformUsers())return;
 const target=accessUserRecord(uidValue);if(!canManageAccessTarget(target))return toast("That account is protected");
 if(currentPlatformRole()==="admin" && !["member","moderator"].includes(role))return toast("Only the Owner can assign Admin/Owner roles");
 try{
  await db.collection("users").doc(uidValue).set({platformRole:role,roleUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),roleUpdatedBy:auth.currentUser.uid},{merge:true});
  toast(`Role updated: ${platformRoleLabel(role)}`);await loadAccessUsers(true);
 }catch(err){console.error("Update role error:",err);alert("Could not update role: "+(err.message||err))}
}

function settingsData(){
 const u = authState ? authState.user : null;
 return `<section class="card pad" style="margin-bottom:16px">
  <h3>Firebase Account & Cloud Firestore</h3>
  <p class="small muted">Connected to Firebase project <strong>freelance-desk-ee209</strong>.</p>
  ${u ? `
   <div class="setting-row"><div><h4>Logged in as</h4><p>${esc(u.email||"")}</p></div><button type="button" class="btn bad sm btn-signout">Sign Out</button></div>

   <div class="setting-row"><div><h4>Auth Provider</h4><p>${esc(u.providerData && u.providerData[0] ? u.providerData[0].providerId : "password")}</p></div></div>
   <div class="setting-row"><div><h4>Access Status</h4><p>${esc(accessStatusLabel(authState.accessStatus))}</p></div><span class="pill ${authState.accessStatus==='approved'?'good':authState.accessStatus==='blocked'?'bad':'warn'}">${esc(accessStatusLabel(authState.accessStatus))}</span></div>
   <div class="setting-row"><div><h4>Platform Role</h4><p>Separate from room-level permissions.</p></div><span class="pill">${esc(platformRoleLabel(currentPlatformRole()))}</span></div>
  ` : '<p class="small warn">Not authenticated.</p>'}
 </section>
 <section class="card pad"><h3>Data Backup & Privacy</h3><p class="small muted">Private workspace data is cached locally and synced to your signed-in Firestore account. Shared Community rooms are stored separately from your private workspace.</p><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn" onclick="document.getElementById('ifile').click()">Import JSON</button><input id="ifile" type="file" accept=".json,application/json" class="hidden" onchange="importData(this.files[0])"><button class="btn" onclick="clearJobCache()">Clear Job Cache</button><button class="btn bad" onclick="resetAll()">Reset All</button></div></section>`
}
function exportData(){const b=new Blob([JSON.stringify({schema:6,exportedAt:new Date().toISOString(),data:state.data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="freelance-desk-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data||o;if(!d||typeof d!=="object")throw Error();if(confirm("Import and merge this backup?")){state.data={...state.data,...d,profile:{...state.data.profile,...(d.profile||{})},settings:{...state.data.settings,...(d.settings||{})}};save();applySettings();render();toast("Backup imported")}}catch{alert("Invalid JSON backup.")}};r.readAsText(f)}
function clearJobCache(){localStorage.removeItem(JOB_CACHE_KEY);state.liveJobs=[];state.sourceHealth={};state.liveStatus="Cache cleared.";toast("Job cache cleared")}
function resetAll(){if(confirm("Delete all locally saved workspace data? Export a backup first if needed.")){localStorage.removeItem(KEY);localStorage.removeItem(JOB_CACHE_KEY);location.reload()}}

function modal(body){document.getElementById("modalRoot").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="x" onclick="closeModal()">×</button>${body}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>toast("Copy failed — select manually"))}

let focusSecs=25*60,focusInt=null,focusRunning=false;
function toggleFocus(){document.getElementById("focus").classList.toggle("hidden");drawFocus()}
function drawFocus(){const e=document.getElementById("focus"),m=String(Math.floor(focusSecs/60)).padStart(2,"0"),s=String(focusSecs%60).padStart(2,"0");e.innerHTML=`<div class="head"><h3>Focus</h3><button class="btn sm" onclick="toggleFocus()">×</button></div><div class="clock">${m}:${s}</div><div class="actions"><button class="btn primary" onclick="runFocus()">${focusRunning?"Pause":"Start"}</button><button class="btn" onclick="resetFocus(25)">25m</button><button class="btn" onclick="resetFocus(50)">50m</button></div><p class="small muted">Completed sessions: ${state.data.focusSessions.length}</p>`}
function runFocus(){focusRunning=!focusRunning;if(focusRunning)focusInt=setInterval(()=>{focusSecs--;if(focusSecs<=0){clearInterval(focusInt);focusRunning=false;state.data.focusSessions.push(new Date().toISOString());save();focusSecs=25*60;toast("Focus session complete")}drawFocus()},1000);else clearInterval(focusInt);drawFocus()}
function resetFocus(m){clearInterval(focusInt);focusRunning=false;focusSecs=m*60;drawFocus()}

function commandIndex(){return [...Object.entries(pages).map(([route,label])=>({label,cat:"Page",desc:"Open "+label,route})),...toolDefs.map(t=>({label:t.n,cat:"Tool",desc:t.d,tool:t.a})),...guideData.map(g=>({label:g.t,cat:"Guide",desc:g.s,guide:g.t})),...workflows.map(([c,t,s])=>({label:t,cat:"Workflow",desc:s,route:"workflows"})),...portfolio.map(([c,t,d])=>({label:t,cat:"Portfolio",desc:d,route:"portfolio"}))]}
function openSearch(){document.getElementById("commandRoot").innerHTML=`<div class="commandbg" onclick="if(event.target===this)closeSearch()"><div class="command"><input id="cmdq" autofocus placeholder="Search pages, tools, guides, workflows…" oninput="cmdResults(this.value)"><div id="cmdres" class="cmdresults"></div></div></div>`;cmdResults("")}
function closeSearch(){document.getElementById("commandRoot").innerHTML=""}
function cmdResults(q){q=q.toLowerCase();const a=commandIndex().filter(x=>!q||(x.label+" "+x.cat+" "+x.desc).toLowerCase().includes(q)).slice(0,35);document.getElementById("cmdres").innerHTML=a.map((x,i)=>`<div class="cmditem" onclick="cmdGo('${encodeURIComponent(JSON.stringify(x))}')"><strong>${esc(x.label)}</strong><div class="small muted">${esc(x.cat)} · ${esc(x.desc)}</div></div>`).join("")||'<div class="empty">No results.</div>'}
function cmdGo(s){const x=JSON.parse(decodeURIComponent(s));closeSearch();if(x.tool)openTool(x.tool);else if(x.guide){navigate("guides");setTimeout(()=>openGuide(encodeURIComponent(x.guide)),20)}else navigate(x.route)}

function setAcademyStage(id){
  if(!CAREER_STAGES[id]) return;
  if(!state.data.academy) state.data.academy = {};
  state.data.academy.stage = id;
  state.data.academy.stageSelectedAt = new Date().toISOString();
  save();
  render();
  toast(`Selected Career Stage: ${CAREER_STAGES[id].title}`);
}

function setAcademyTrack(t){
  if(!ACADEMY_NICHE_TRACKS[t]) return;
  if(!state.data.academy) state.data.academy = {};
  state.data.academy.track = t;
  save();
  render();
  toast(`Active Track set to: ${ACADEMY_NICHE_TRACKS[t].title}`);
}

function setAcademyLevel(lvl){
  if(!["basic","intermediate","advanced"].includes(lvl)) return;
  if(!state.data.academy) state.data.academy = {};
  state.data.academy.level = lvl;
  save();
  render();
  toast(`Competency View set to: ${lvl.toUpperCase()}`);
}

function toggleUpskillInterest(item){
  if(!state.data.academy) state.data.academy = {};
  if(!Array.isArray(state.data.academy.upskillInterests)) state.data.academy.upskillInterests = [];
  const list = state.data.academy.upskillInterests;
  const idx = list.indexOf(item);
  if(idx >= 0) list.splice(idx, 1);
  else list.push(item);
  save();
  render();
  toast(list.includes(item) ? `Added upskill focus: ${item}` : `Removed upskill focus: ${item}`);
}

function getAcademyData(){
  if(!state.data.academy) state.data.academy = {};
  const ac = state.data.academy;
  if(!ac.stage) ac.stage = "beginner";
  if(!ac.track) ac.track = "general_va";
  if(!ac.level) ac.level = "basic";
  if(!ac.upskillInterests) ac.upskillInterests = [];
  if(!ac.progress) ac.progress = {};
  if(!ac.realWorkLab) {
    ac.realWorkLab = { activeSimulation: null, completedSimulations: [] };
  }
  if(!ac.realWorkLab.completedSimulations) ac.realWorkLab.completedSimulations = [];
  if(!ac.mockInterview) {
    ac.mockInterview = { mode: "recruiter", activeSession: null, completedAttempts: [] };
  }
  if(!ac.mockInterview.completedAttempts) ac.mockInterview.completedAttempts = [];
  return ac;
}

}

}

  }

    priority,

function isMeaningfulResponse(text) {
  if (!text || typeof text !== "string") return false;
  const trimmed = text.trim();
  if (trimmed.length < 12) return false;

  const words = trimmed.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
  if (words.length < 3) return false;

  const uniqueWords = new Set(words);
  if (uniqueWords.size / words.length < 0.4) return false;

  const commonWords = new Set([
    "the","be","to","of","and","a","in","that","have","i","it","for","not","on","with","he","as","you","do","at","this","but","his","by","from","they","we","say","her","she","or","an","will","my","one","all","would","there","their","what","so","up","out","if","about","who","get","which","go","me","when","make","can","like","time","no","just","him","know","take","people","into","year","your","good","some","could","them","see","other","than","then","now","look","only","come","its","over","think","also","back","after","use","two","how","our","work","first","well","way","even","new","want","because","any","these","give","day","most","us",
    "check","send","verify","email","confirm","ask","notify","client","meeting","schedule","invoice","reschedule","update","calendar","contact","review","escalate","handle","follow","message","draft","patient","nurse","doctor","sop","priority","date","info","details","copy","file","drive","link","status","recap","board","log","task","eod","report","call","action","address","fix","correct","process","urgent","cancel","resend","rate","price","pay","amount","contract","customer","user","manager","team","lead","boss","alex"
  ]);

  let validCount = 0;
  for (const w of words) {
    if (commonWords.has(w)) {
      validCount++;
    } else if (w.length >= 3 && /[aeiouy]/.test(w) && !/[bcdfghjklmnpqrstvwxz]{5,}/.test(w)) {
      validCount++;
    }
  }

  if (validCount < 2 || (validCount / words.length) < 0.4) {
    return false;
  }

  return true;
}

function evaluateSimulation(sim) {
  const responses = sim.responses || [];
  const totalEvents = (sim.events || []).length || 4;
  let earnedScore = 0;
  let meaningfulCount = 0;
  const handledWell = [];
  const missedRisks = [];
  const verifyChecklist = [];

  responses.forEach((resp, idx) => {
    const ev = sim.events[idx];
    if (!ev) return;

    const actionText = resp.action || "";
    const isActionValid = isMeaningfulResponse(actionText);

    if (isActionValid) {
      meaningfulCount++;
      let eventPoints = 10;
      
      const lowerAction = actionText.toLowerCase();
      if (lowerAction.includes("zoom") || lowerAction.includes("calendar") || lowerAction.includes("invoice") || lowerAction.includes("drive") || lowerAction.includes("contract") || lowerAction.includes("slack") || lowerAction.includes("clickup") || lowerAction.includes("ehr") || lowerAction.includes("nurse") || lowerAction.includes("email") || lowerAction.includes("recap") || lowerAction.includes("triage") || lowerAction.includes("sop") || lowerAction.includes("gmail") || lowerAction.includes("label") || lowerAction.includes("filter") || lowerAction.includes("archive") || lowerAction.includes("search")) {
        eventPoints += 5;
      }

      if (resp.priority === ev.idealPriority) {
        eventPoints += 4;
      } else {
        missedRisks.push(`Event ${idx+1}: Priority selected was "${resp.priority}"; target priority is "${ev.idealPriority}".`);
      }

      if (isMeaningfulResponse(resp.verify)) {
        eventPoints += 3;
      } else {
        verifyChecklist.push(`Event ${idx+1}: Specify verification steps (e.g. check calendar availability, verify contract numbers, or confirm SOPs).`);
      }

      if (resp.escalate && (resp.escalate === ev.idealEscalate || resp.escalate.slice(0, 3) === ev.idealEscalate.slice(0, 3))) {
        eventPoints += 3;
      }

      earnedScore += eventPoints;
      handledWell.push(`Event ${idx+1} (${ev.time}): Provided clear operational action steps.`);

      if (sim.niche === "medical_admin") {
        const fullText = (actionText + " " + (resp.notes || "") + " " + (resp.verify || "")).toLowerCase();
        if (fullText.includes("nurse") || fullText.includes("doctor") || fullText.includes("route") || fullText.includes("triage") || fullText.includes("provider")) {
          handledWell.push(`Event ${idx+1}: Maintained medical administrative boundary by routing clinical query to licensed provider.`);
        } else {
          missedRisks.push(`Event ${idx+1}: Medical Admin Boundary Risk — Did not explicitly state routing clinical dosage queries to a licensed triage nurse/provider.`);
        }
      }
    } else {
      missedRisks.push(`Event ${idx+1} (${ev.time}): No meaningful operational action could be identified from this response. Missing operational details: action steps, tools/workflow, verification, communication, and documentation.`);
    }
  });

  let score = 0;
  if (totalEvents > 0) {
    score = Math.min(100, Math.max(0, Math.round((earnedScore / (totalEvents * 25)) * 100)));
  }

  if (meaningfulCount === 0) {
    score = 0;
    missedRisks.unshift("Insufficient meaningful responses to assess this simulation reliably. Response could not be evaluated meaningfully.");
    verifyChecklist.push("Provide concrete step-by-step actions using operational tools (e.g. Google Calendar, Slack, EHR, Notion).");
  }

  const simulationStatus = `Completed (${responses.length}/${totalEvents} Events)`;
  const specialApproach = sim.taskKey === "executive_inbox_recovery"
    ? "1. Audit all 3 accounts and confirm no-delete/archive-only constraints → 2. Protect VIP/client/finance/security mail first → 3. Segment backlog using labels, search rules, sender/domain patterns, dates and subscription categories → 4. Test each rule on a small sample → 5. Archive approved low-priority groups in controlled batches, account by account → 6. Create incoming filters/labels and safe auto-archive rules for approved senders → 7. Document queries, counts, exceptions and remaining priority mail → 8. Send an executive inbox handoff and ongoing review cadence."
    : "1. Acknowledge client request immediately → 2. Verify SOP and missing links → 3. Communicate expected completion time → 4. Execute quality check → 5. Log status in project board.";

  return {
    score,
    simulationStatus,
    meaningfulCount,
    handledWell,
    missedRisks,
    verifyChecklist: verifyChecklist.length ? verifyChecklist : ["Verify all file permissions before client handoff."],
    suggestedApproach: specialApproach,
    recommendedSkill: `${(typeof ACADEMY_NICHE_TRACKS !== "undefined" && ACADEMY_NICHE_TRACKS[sim.niche]) ? ACADEMY_NICHE_TRACKS[sim.niche].title : 'VA'} Tools & Workflows Lab`,
    disclaimer: "Observed Real-World Pattern · Realistic Practice Simulation · Recommended Approach\nThis feedback is generated using transparent operational criteria for skill development. It is a simulation for practice and does not guarantee client outcomes or represent certified professional authority."
  };
}
