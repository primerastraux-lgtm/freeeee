function generateInterviewQuestions(modeKey, nicheKey, stageKey, levelKey) {
  const track = (typeof ACADEMY_NICHE_TRACKS !== "undefined" && ACADEMY_NICHE_TRACKS[nicheKey]) ? ACADEMY_NICHE_TRACKS[nicheKey] : (ACADEMY_NICHE_TRACKS.general_va || { title: "Virtual Assistant", levels: { basic: { responsibilities: ["Admin"], tasks: ["Task 1"], tools: ["Google Workspace"] } } });
  const levelObj = (track.levels && track.levels[levelKey]) ? track.levels[levelKey] : (track.levels ? track.levels.basic : { responsibilities: ["Admin"], tasks: ["Task 1"], tools: ["Google Workspace"] });

  const questions = [
    {
      id: "q1",
      num: 1,
      category: "Introduction & Value Proposition",
      question: `Can you introduce yourself and explain your focus in ${track.title} at the ${levelKey.toUpperCase()} level?`,
      contextTip: "Focus on your primary tool stack, client value, and how you organize day-to-day work.",
      keyIndicators: ["STAR or Operational Flow", "Tool mention", "Client benefit / ROI"],
      sampleFramework: "Background (1 sentence) → Core Tool Stack → Key Responsibility Handled → Primary Benefit to Client."
    },
    {
      id: "q2",
      num: 2,
      category: "Workflow & Tool Execution",
      question: `How do you use tools like ${(levelObj.tools || ['Google Workspace']).slice(0, 3).join(', ')} to manage ${(levelObj.responsibilities || ['admin duties'])[0]}?`,
      contextTip: "Describe your concrete workflow sequence and how you ensure accuracy before handoff.",
      keyIndicators: ["Tool proficiency", "Verification step", "Quality control"],
      sampleFramework: "Tool Setup → Process Steps → Quality Control Check → Client Handoff."
    },
    {
      id: "q3",
      num: 3,
      category: "Problem Solving & Ambiguity",
      question: `Describe a scenario where a client gave incomplete instructions for ${(levelObj.tasks || ['a task'])[0]}. How did you handle it?`,
      contextTip: "Explain how you verified missing details without overwhelming the client.",
      keyIndicators: ["Proactive verification", "Communication tone", "Escalation judgment"],
      sampleFramework: "Situation → Missing Info Identified → Proactive Verification Action → Solution Delivered."
    },
    {
      id: "q4",
      num: 4,
      category: "Client Communication & Reliability",
      question: `How do you handle competing client priorities when two urgent deadlines overlap?`,
      contextTip: "Show client focus, proactive prioritization, and clear status updates.",
      keyIndicators: ["Prioritization logic", "Proactive update", "Time defense"],
      sampleFramework: "Assess Urgency/Impact → Communicate Status & Options to Client → Execute Primary → Deliver Secondary."
    }
  ];

  if (["general_va", "executive_va"].includes(nicheKey)) {
    questions.push({
      id: "q5-inbox-recovery",
      num: questions.length + 1,
      category: "Executive Inbox Management & Systems Thinking",
      question: "How will you handle 3 email accounts, each with 300k+ unread emails, including subscriptions sending 3+ emails per day?",
      contextTip: "Assume the client does not allow deletion — archive only. Do not propose reviewing 900,000+ emails one-by-one. Explain how you protect important messages, segment the backlog, test filters before bulk actions, archive safely in batches, and prevent the inbox from rebuilding.",
      keyIndicators: [
        "Does not process hundreds of thousands of emails manually one-by-one",
        "Protects VIP, client, finance, legal/security, and time-sensitive messages first",
        "Uses Gmail search, labels, filters, sender/domain/date patterns, and controlled bulk archive",
        "Tests rules on a sample before applying them broadly",
        "Respects archive-only / no-delete constraint",
        "Creates incoming rules and an ongoing review cadence",
        "Documents decisions, exceptions, and communicates progress to the client"
      ],
      sampleFramework: "Assess & Confirm Constraints → Protect Priority Mail → Segment by Sender/Category/Date → Test Rules → Bulk Archive Approved Low-Priority Mail → Automate Incoming Sorting → Report & Maintain."
    });
  }

  return questions;
}

function startInterviewSession(mode){
  const ac = getAcademyData();
  const questions = generateInterviewQuestions(mode, ac.track, ac.stage, ac.level);
  ac.mockInterview.activeSession = {
    id: uid(),
    mode,
    niche: ac.track,
    stage: ac.stage,
    level: ac.level,
    currentQuestionIndex: 0,
    questions,
    responses: [],
    showFeedback: false,
    startedAt: new Date().toISOString()
  };
  save();
  toast("Interview session launched! Question 1 loaded.");
  render();
}

function submitInterviewAnswer(){
  const ac = getAcademyData();
  const session = ac.mockInterview.activeSession;
  if (!session) return;

  const answerText = document.getElementById("interviewAnswer")?.value || "";
  const expType = document.getElementById("interviewExpType")?.value || "simulation";
  const prepType = document.getElementById("interviewPrepType")?.value || "self";

  if (!answerText.trim()) {
    toast("Please enter your answer before submitting.");
    return;
  }

  const q = session.questions[session.currentQuestionIndex];
  const feedback = analyzeInterviewAnswer(q, answerText, expType, prepType, session);

  session.responses[session.currentQuestionIndex] = {
    questionId: q.id,
    questionText: q.question,
    answerText,
    expType,
    prepType,
    feedback,
    submittedAt: new Date().toISOString()
  };
  session.showFeedback = true;
  save();
  toast("Answer analyzed! Review feedback below.");
  render();
}

function nextInterviewQuestion(){
  const ac = getAcademyData();
  const session = ac.mockInterview.activeSession;
  if (!session) return;

  if (session.currentQuestionIndex < session.questions.length - 1) {
    session.currentQuestionIndex += 1;
    session.showFeedback = false;
    save();
    toast(`Loading Question ${session.currentQuestionIndex + 1}...`);
  } else {
    // Completed all questions -> calculate overall attempt score & save to history
    const completedAttempt = {
      id: session.id,
      timestamp: new Date().toISOString(),
      mode: session.mode,
      niche: session.niche,
      stage: session.stage,
      level: session.level,
      responses: session.responses,
      summary: evaluateFullInterview(session.responses)
    };
    ac.mockInterview.completedAttempts.unshift(completedAttempt);
    ac.mockInterview.activeSession = null;
    save();
    toast("Interview attempt completed & saved to history!");
  }
  render();
}

function restartInterviewSession(){
  const ac = getAcademyData();
  ac.mockInterview.activeSession = null;
  save();
  toast("Interview session reset.");
  render();
}

function analyzeInterviewAnswer(question, answerText, expType, prepType, session) {
  const text = (answerText || "").trim();
  const expLabels = {
    formal: "Formal Client / Remote Employment",
    internship: "Internship / Project Experience",
    simulation: "Academy Practice Simulation Experience",
    transferable: "Transferable Experience from Previous Role",
    hypothetical: "Hypothetical Professional Approach"
  };

  const expLabel = expLabels[expType] || "Practice Answer";
  const niche = session?.niche || (typeof state !== "undefined" && state?.data?.profile?.niche) || "general_va";
  const trackTitle = niche.toUpperCase().replace(/_/g, " ");

  // 1. REUSE EXISTING MEANINGFUL RESPONSE VALIDATOR
  if (typeof isMeaningfulResponse === "function" && !isMeaningfulResponse(text)) {
    return {
      isValid: false,
      score: 0,
      rating: "Invalid / Non-Evaluable Response",
      structureRating: "Invalid Framework",
      evidenceRating: "Invalid / Non-Evaluable",
      authenticityStatus: "Invalid / Non-Evaluable",
      aiNotice: null,
      words: text ? text.split(/\s+/).length : 0,
      expLabel,
      strengths: [],
      improvements: ["Response could not be evaluated meaningfully. Please provide a clear, structured response using real or simulated work context."],
      howToImprove: [
        "Add the actual situation/context",
        "Explain what YOU were responsible for",
        "Name the tool/workflow used",
        "Explain what you verified",
        "Explain why you prioritized that action",
        "Add how you communicated",
        "Add the real result, if one exists (if no real result exists, do not invent one)"
      ],
      suggestedAnswer: `Practice Example — personalize this with your real experience:
• Situation (Practice Scenario): When asked "${question.question}" in a ${trackTitle} context...
• Action: I first verified requirements using standard tools (e.g. Google Workspace, Slack, Notion), prioritized urgent tasks, and communicated with stakeholders.
• Reasoning: Verified details before execution to prevent errors and ensure alignment.
• Expected Outcome (Hypothetical Model): [Insert your actual result if available — e.g. Clear alignment with client and on-time task delivery].`,
      sampleFramework: question.sampleFramework
    };
  }

  const lower = text.toLowerCase();
  const words = text.split(/\s+/).length;

  // Structure detection
  const hasSTAR = lower.includes("situation") || lower.includes("task") || lower.includes("action") || lower.includes("result") || lower.includes("when ") || lower.includes("first,") || lower.includes("then,") || lower.includes("first ");
  const hasOpsFlow = lower.includes("verify") || lower.includes("check") || lower.includes("confirm") || lower.includes("priorit") || lower.includes("communicat") || lower.includes("follow up") || lower.includes("escalat");
  const hasStructure = hasSTAR || hasOpsFlow;

  // Specificity & Content signals
  const hasClientFocus = lower.includes("client") || lower.includes("save time") || lower.includes("efficient") || lower.includes("value") || lower.includes("help") || lower.includes("organized") || lower.includes("deliver") || lower.includes("roi");
  const hasTool = lower.includes("google") || lower.includes("slack") || lower.includes("notion") || lower.includes("clickup") || lower.includes("asana") || lower.includes("sheet") || lower.includes("mail") || lower.includes("crm") || lower.includes("ehr") || lower.includes("excel") || lower.includes("zoom");
  const hasVerification = lower.includes("verify") || lower.includes("check") || lower.includes("confirm") || lower.includes("double check") || lower.includes("review");
  
  // Concrete Ownership (requires specific action verbs, not just "I always")
  const hasConcreteAction = lower.includes("i verified") || lower.includes("i decided") || lower.includes("i handled") || lower.includes("i created") || lower.includes("i managed") || lower.includes("i checked") || lower.includes("i contacted") || lower.includes("my responsibility was") || lower.includes("i first verified");

  // Question Relevance Check
  const qText = (question.question || "").toLowerCase();
  let isRelevant = true;
  if (qText.includes("introduce") || qText.includes("yourself") || qText.includes("tell me about")) {
    isRelevant = lower.includes("background") || lower.includes("experience") || lower.includes("skills") || lower.includes("assistant") || lower.includes("role") || lower.includes("work") || lower.includes("i am");
  } else if (qText.includes("tool") || qText.includes("software") || qText.includes("tech")) {
    isRelevant = hasTool || lower.includes("system") || lower.includes("platform");
  } else if (qText.includes("priorit") || qText.includes("urgent") || qText.includes("competing") || qText.includes("deadline")) {
    isRelevant = lower.includes("priorit") || lower.includes("urgent") || lower.includes("first") || lower.includes("calendar") || lower.includes("schedule") || lower.includes("task") || lower.includes("deadline");
  }

  // Generic phrase detection
  const genericPhrases = [
    "i always prioritize communication and efficiency",
    "deliver high quality results",
    "synergy",
    "streamline process",
    "proactive and dedicated",
    "hardworking and detail-oriented"
  ];
  const isGenericDominant = genericPhrases.some(p => lower.includes(p)) || (!hasConcreteAction && !hasTool && words >= 20);

  // Authenticity & Evidence Status
  let authenticityStatus = "Needs More Personal Detail";
  if (words >= 30 && hasTool && hasStructure && hasConcreteAction && !isGenericDominant && isRelevant) {
    authenticityStatus = "Personal / Evidence-Rich";
  } else if (isGenericDominant || (!hasTool && !hasConcreteAction && words < 35)) {
    authenticityStatus = "Highly Generic / Template-Like";
  }

  // Structure Rating
  let structureRating = "Basic Framework";
  if (hasStructure && words >= 25) structureRating = "Strong Framework";
  else if (hasStructure || words >= 20) structureRating = "Moderate Framework";

  // Score Calculation with Capping based on Evidence & Relevance
  let baseScore = 40;
  if (words >= 25) baseScore += 10;
  if (hasStructure) baseScore += 15;
  if (isRelevant) baseScore += 15;
  if (hasTool) baseScore += 10;
  if (hasVerification) baseScore += 5;
  if (hasConcreteAction) baseScore += 5;

  let score = baseScore;
  if (authenticityStatus === "Needs More Personal Detail") {
    score = Math.min(65, score);
  } else if (authenticityStatus === "Highly Generic / Template-Like") {
    score = Math.min(50, score);
  } else {
    score = Math.min(100, score);
  }

  if (!isRelevant) {
    score = Math.min(55, score);
  }

  // Rating Label
  let rating = "Good Practice Response";
  if (score >= 80 && authenticityStatus === "Personal / Evidence-Rich") {
    rating = "Strong Evidence-Based Response";
  } else if (authenticityStatus === "Needs More Personal Detail") {
    rating = "Structured Answer — Needs Personal Detail";
  } else if (authenticityStatus === "Highly Generic / Template-Like") {
    rating = "Generic Practice Response — Needs Specifics";
  } else if (score < 60) {
    rating = "Basic Response — Needs Structure & Detail";
  }

  let aiNotice = null;
  if (prepType === "ai_heavy" || prepType === "ai_brainstorm") {
    aiNotice = "You indicated using AI/templates for this response. Ensure you can explain and defend every detail naturally in your own words during a live interview.";
  } else if (authenticityStatus === "Highly Generic / Template-Like") {
    aiNotice = "Possible AI-assisted or template-style response — this is not proof of AI use. Personalize the answer with specific work context before a real interview.";
  }

  const strengths = [];
  if (hasStructure) strengths.push(`Clear response structure detected (${structureRating}).`);
  if (hasTool) strengths.push("Explicitly referenced standard tools and software.");
  if (hasConcreteAction && authenticityStatus === "Personal / Evidence-Rich") {
    strengths.push("Clear personal ownership and action responsibility demonstrated.");
  }
  if (hasVerification) strengths.push("Included proactive verification or quality-control check.");
  if (isRelevant && hasClientFocus) strengths.push("Demonstrated client focus aligned with question context.");

  const improvements = [];
  if (!isRelevant) improvements.push("Ensure your answer directly addresses the specific question asked.");
  if (authenticityStatus !== "Personal / Evidence-Rich") {
    improvements.push("Replace general statements with a specific situation or concrete project example.");
  }
  if (!hasTool) improvements.push("Mention specific software tools (e.g. Google Workspace, Notion, Slack, ClickUp) to show tool command.");
  if (!hasConcreteAction) improvements.push("Detail what YOU specifically handled or decided in a concrete scenario rather than general habits.");
  if (!hasVerification) improvements.push("Mention what you double-checked or verified before concluding.");

  const howToImprove = [];
  if (!isRelevant) howToImprove.push("Focus directly on answering the prompt.");
  howToImprove.push("Add the actual situation/context that prompted this work.");
  howToImprove.push("Explain what YOU specifically were responsible for handling.");
  howToImprove.push("Name the exact tool/workflow used (e.g. Slack, Notion, Google Calendar).");
  howToImprove.push("Explain what you verified or checked before handoff.");
  howToImprove.push("Explain why you prioritized that action over other choices.");
  howToImprove.push("Add the real result, if one exists (if no real result exists, do not invent one).");

  // Suggested Answer framing (SAFE framing - no fake employment or fabricated past results)
  const isFormalExp = expType === "formal";
  const scenarioContext = isFormalExp 
    ? `In a previous formal ${trackTitle} role or practice scenario...`
    : `In a practice ${trackTitle} scenario...`;

  const suggestedAnswer = `Practice Example — personalize this with your real experience:
• Situation (Practice Model): ${scenarioContext} when asked "${question.question}"...
• Action: [Explain what you personally handled] — e.g. I first verified requirements using standard tools (e.g. Google Workspace, Slack, Notion), prioritized urgent tasks, and communicated expected turnaround.
• Reasoning: Verified details first to prevent miscommunication and ensure quality.
• Expected Outcome (Hypothetical Model): [Add your actual result if available] — e.g. Clear alignment with client and on-time task delivery.`;

  return {
    isValid: true,
    score,
    rating,
    structureRating,
    evidenceRating: authenticityStatus,
    authenticityStatus,
    aiNotice,
    words,
    expLabel,
    strengths: strengths.length ? strengths : ["Valid response submitted."],
    improvements: improvements.length ? improvements : ["Solid response. Practice delivering comfortably."],
    howToImprove,
    suggestedAnswer,
    sampleFramework: question.sampleFramework
  };
}

function evaluateFullInterview(responses) {
  const totalQuestions = (responses || []).length || 4;
  const validResponses = (responses || []).filter(r => r && r.feedback && r.feedback.isValid);
  const validCount = validResponses.length;

  if (validCount === 0) {
    return {
      overallScore: 0,
      totalQuestions,
      validCount: 0,
      isValidInterview: false,
      status: "Invalid / Non-Evaluable Interview",
      clarityScore: "Invalid",
      clientFocusScore: "Invalid",
      recommendation: "Insufficient meaningful responses to assess readiness. Complete another practice attempt using specific, relevant answers."
    };
  }

  const sumScores = validResponses.reduce((acc, r) => acc + (r.feedback.score || 0), 0);
  const avgScore = Math.round(sumScores / validCount);
  const overallScore = Math.round(avgScore * (validCount / totalQuestions));

  if (validCount < Math.ceil(totalQuestions / 2)) {
    return {
      overallScore,
      totalQuestions,
      validCount,
      isValidInterview: false,
      status: `Insufficient Meaningful Responses (${validCount}/${totalQuestions} Valid)`,
      clarityScore: "Low",
      clientFocusScore: "Needs Improvement",
      recommendation: "Insufficient meaningful responses to assess readiness. Complete another practice attempt using specific, relevant answers."
    };
  }

  let recommendation = "";
  if (overallScore >= 80) {
    recommendation = "Ready for live recruiter screenings and client discovery calls. Continue personalizing answers with your real experience.";
  } else if (overallScore >= 60) {
    recommendation = "Developing interview readiness. Practice adding specific tool references, verification steps, and clear outcomes.";
  } else {
    recommendation = "Needs improvement before live client calls. Practice structuring answers with STAR or Operational Flow and naming real tools.";
  }

  return {
    overallScore,
    totalQuestions,
    validCount,
    isValidInterview: true,
    status: `Completed (${validCount}/${totalQuestions} Valid Questions)`,
    clarityScore: overallScore >= 80 ? "High" : (overallScore >= 60 ? "Medium" : "Low"),
    clientFocusScore: overallScore >= 80 ? "Strong" : (overallScore >= 60 ? "Moderate" : "Basic"),
    recommendation
  };
}

function getReadyKitProgress(){
  ensureAcademyState();
  const kit = state.data.academy.clientReadyKit || {};
  let count = 0;
  CLIENT_READY_ITEMS.forEach(item => {
    if(kit[item.id] && kit[item.id].status === "ready") count++;
  });
  return `${count}/${CLIENT_READY_ITEMS.length} Ready`;
}

function setClientReadyStatus(itemId, newStatus){
  ensureAcademyState();
  if(!state.data.academy.clientReadyKit[itemId]){
    state.data.academy.clientReadyKit[itemId] = { status: "not_started", notes: "", updatedAt: "" };
  }
  state.data.academy.clientReadyKit[itemId].status = newStatus;
  state.data.academy.clientReadyKit[itemId].updatedAt = new Date().toISOString();
  save();
  toast(`Asset status updated: ${newStatus.replace("_", " ").toUpperCase()}`);

}

function savePricingPackageFromForm(pkgId){
  ensureAcademyState();
  const getVal = id => document.getElementById(id)?.value?.trim() || "";
  const targetId = pkgId ? String(pkgId) : ("pkg_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 9));
  
  const packageData = {
    id: targetId,
    name: getVal("pkg_name"),
    type: getVal("pkg_type"),
    price: getVal("pkg_price"),
    targetClient: getVal("pkg_targetClient"),
    services: getVal("pkg_services"),
    deliverables: getVal("pkg_deliverables"),
    capacity: getVal("pkg_capacity"),
    responseTime: getVal("pkg_responseTime"),
    turnaround: getVal("pkg_turnaround"),
    meetings: getVal("pkg_meetings"),
    revisions: getVal("pkg_revisions"),
    commMethod: getVal("pkg_commMethod"),
    exclusions: getVal("pkg_exclusions"),
    addons: getVal("pkg_addons"),
    paymentSchedule: getVal("pkg_paymentSchedule"),
    minCommitment: getVal("pkg_minCommitment"),
    cancellationNotes: getVal("pkg_cancellationNotes")
  };

  let packages = state.data.academy.pricingPackages || [];
  const idx = packages.findIndex(p => String(p.id) === targetId);
  if(idx >= 0) packages[idx] = packageData;
  else packages.push(packageData);

  state.data.academy.pricingPackages = packages;
  save();
  closeModal();
  toast("Pricing package saved successfully");
  render();
}

function confirmDeletePricingPackage(pkgId){
  ensureAcademyState();
  const targetId = String(pkgId);
  state.data.academy.pricingPackages = (state.data.academy.pricingPackages || []).filter(p => String(p.id) !== targetId);
  save();
  closeModal();
  toast("Pricing package deleted");
  render();
}

function duplicatePricingPackage(pkgId){
  ensureAcademyState();
  const packages = state.data.academy.pricingPackages || [];
  const targetId = String(pkgId);
  const pkg = packages.find(p => String(p.id) === targetId);
  if(!pkg) return;

  const newId = "pkg_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 9);
  const copy = JSON.parse(JSON.stringify(pkg));
  copy.id = newId;
  copy.name = (pkg.name || "Package") + " (Copy)";

  packages.push(copy);
  state.data.academy.pricingPackages = packages;
  save();
  toast("Package duplicated");
  render();
}

      captionDirection = `1. Clearly state this is a practice simulation deliverable built in Freelance Desk Academy.\n2. Show the setup (categories, color codes, escalation rules).\n3. Explain why this structure prevents scheduling friction.`;
      cta = `Need a structured calendar setup? Check out my full portfolio link in bio.`;
      repurpose = `Post screenshot as an image asset with a step-by-step breakdown.`;
      break;
    case "Case Study":
      hook = `[Practice / Simulated Case Study Example] Streamlining email triage for a busy remote leader:`;
      captionDirection = `1. Problem: Client receives 100+ emails daily.\n2. Solution: Created 4 primary labels, VIP filter rules, and a 5-min EOD recap snippet.\n3. Outcome (Simulated Practice Model): Saved 1.5 hours daily in inbox review time.`;
      cta = `Want to streamline your email workflow? DM me for a quick consultation.`;
      repurpose = `Summarize into a 3-part case study graphic or newsletter case breakdown.`;
      break;
    default:
      hook = `3 simple ways to improve ${track.title} efficiency without adding extra software:`;
      captionDirection = `1. Share quick action item 1.\n2. Share quick action item 2.\n3. Share quick action item 3.`;
      cta = `Which of these 3 steps is currently missing in your business? Comment below!`;
      repurpose = `Turn into a short text quote or quick Q&A story post.`;
  }

  defaultDraft = `${hook}\n\n${captionDirection.replace(/\\n/g, "\n")}\n\n👉 ${cta}`;

  return { hook, captionDirection, cta, repurpose, defaultDraft };
}

async function ensureInitialPlatformOwner(user, accessStatus, role){
 if(!db||!user||accessStatus!=="approved")return role;
 const configRef=db.collection("system").doc("accessControl");
 try{
  let configSnap=await configRef.get();
  if(!configSnap.exists){
   try{
    await db.runTransaction(async tx=>{
     const fresh=await tx.get(configRef);
     if(!fresh.exists){
      tx.set(configRef,{ownerUid:user.uid,ownerEmail:user.email||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
     }
    });
   }catch(claimErr){console.warn("Owner bootstrap claim skipped:",claimErr?.message||claimErr)}
   configSnap=await configRef.get();
  }
  if(configSnap.exists && configSnap.data()?.ownerUid===user.uid){
   if(role!=="owner"){
    await db.collection("users").doc(user.uid).set({platformRole:"owner",accessStatus:"approved",roleUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),roleUpdatedBy:"system-bootstrap"},{merge:true});
   }
   return "owner";
  }
 }catch(err){console.warn("Owner bootstrap unavailable:",err?.message||err)}
 return role;
}

async function resolveUserAccess(user){
 if(!db||!user)throw new Error("Cloud access database is unavailable.");
 const ref=db.collection("users").doc(user.uid);
 let snap=await ref.get();
 let record=snap.exists?snap.data():null;
 let accessStatus="pending", platformRole="member";

 if(!snap.exists){
  const created={uid:user.uid,email:user.email||"",displayName:user.displayName||(user.email?user.email.split("@")[0]:"Freelancer"),photoURL:user.photoURL||"",accessStatus:"pending",platformRole:"member",createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastLogin:firebase.firestore.FieldValue.serverTimestamp()};
  await ref.set(created,{merge:true});
  record={...created};
 }else{
  const hadAccessField=ACCESS_STATUSES.includes(record?.accessStatus);
  if(!hadAccessField){
   // Backward-compatible migration: accounts that existed before the approval system remain usable.
   accessStatus="approved";
   platformRole=normalizePlatformRole(record?.platformRole);
   await ref.set({accessStatus,platformRole,accessMigratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  }else{
   accessStatus=normalizeAccessStatus(record.accessStatus);
   platformRole=normalizePlatformRole(record.platformRole);
  }
  await ref.set({uid:user.uid,email:user.email||record.email||"",displayName:user.displayName||record.displayName||(user.email?user.email.split("@")[0]:"Freelancer"),photoURL:user.photoURL||record.photoURL||"",lastLogin:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 }

 accessStatus=record?.accessStatus&&ACCESS_STATUSES.includes(record.accessStatus)?record.accessStatus:accessStatus;
 platformRole=normalizePlatformRole(record?.platformRole||platformRole);
 if(accessStatus==="approved")platformRole=await ensureInitialPlatformOwner(user,accessStatus,platformRole);
 const fresh=await ref.get();
 const freshData=fresh.exists?fresh.data():record||{};
 return {record:freshData,accessStatus:normalizeAccessStatus(freshData.accessStatus||accessStatus),platformRole:normalizePlatformRole(freshData.platformRole||platformRole)};
}

   const mergedKits=new Map(localKits.map(item=>[item.id,item]));
   kitsSnap.docs.forEach(doc=>{const item=doc.data();if(item?.id)mergedKits.set(item.id,item)});
   state.data.applicationKits=[...mergedKits.values()].sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))).slice(0,40);
  }else if(localKits.length){localKits.slice(0,40).forEach(syncApplicationKitToCloud)}
 }catch(kitErr){console.error("Application Kits cloud load error:",kitErr)}
 localStorage.setItem(KEY,JSON.stringify(state.data));
 save();
 console.log("Approved private cloud workspace loaded");
}

if (auth) {
  auth.onAuthStateChanged(async user => {
    authState.user = user;
    authState.error = "";
    authState.message = "";
    authState.accessUsers=[];authState.accessUsersLoaded=false;authState.accessUsersLoading=false;authState.accessUsersError="";
    isGoogleSigningIn = false;
    isSigningOut = false;

    if (!user) {
      authState.loading = false;
      authState.accessStatus = "checking";
      authState.platformRole = "member";
      authState.userRecord = null;
      stopCommunityRealtime();
      updateAuthUI();
      return;
    }

    authState.loading = true;
    authState.accessStatus = "checking";
    updateAuthUI();

    try {
      const resolved = await resolveUserAccess(user);
      authState.accessStatus = resolved.accessStatus;
      authState.platformRole = resolved.platformRole;
      authState.userRecord = resolved.record;

      if (authState.accessStatus === "approved") {
        await loadApprovedWorkspaceForUser(user, resolved.record);
        if (user.displayName && (!state.data.profile.name || state.data.profile.name === "Friend")) {
          state.data.profile.name = user.displayName;
          save();
        }
        startCommunityRealtime();
      } else {
        stopCommunityRealtime();
      }
    } catch (err) {
      console.error("Access check error:", err);
      authState.accessStatus = "error";
      authState.error = "We could not verify workspace access. Please try Refresh Access or contact the workspace owner.";
      stopCommunityRealtime();
    } finally {
      authState.loading = false;
      updateAuthUI();
    }
  });
} else {
  authState.loading = false;
  authState.error = "Firebase Authentication is unavailable.";
  updateAuthUI();
}

async function refreshAccessStatus(){
 if(!auth?.currentUser||!db)return;
 authState.loading=true;authState.error="";updateAuthUI();
 try{
  const resolved=await resolveUserAccess(auth.currentUser);
  authState.accessStatus=resolved.accessStatus;authState.platformRole=resolved.platformRole;authState.userRecord=resolved.record;
  if(resolved.accessStatus==="approved"){location.reload();return}
 }catch(err){console.error("Refresh access error:",err);authState.accessStatus="error";authState.error=err.message||"Unable to refresh access."}
 finally{authState.loading=false;updateAuthUI()}
}

function setAuthMode(m) {
  authState.mode = m;
  authState.error = "";
  authState.message = "";
  renderAuthPortal();
}

function renderAuthPortal() {
  const container = document.getElementById("authContainer");
  if (!container) return;

  if (authState.loading) {
    container.innerHTML = `
      <div class="auth-box" style="text-align:center">
        <div class="brandmark" style="margin:0 auto 16px">FD</div>
        <h3>Connecting Workspace…</h3>
        <p class="muted small">${authState.user?'Checking account approval and role':'Verifying authentication session'}</p>
      </div>`;
    return;
  }

  if(authState.user && authState.accessStatus!=="approved"){
    const pending=authState.accessStatus==="pending", blocked=authState.accessStatus==="blocked", accessError=authState.accessStatus==="error";
    container.innerHTML=`<div class="auth-box" style="text-align:center">
      <div class="auth-header"><div class="brandmark">FD</div><h2>${pending?'Access Request Received':blocked?'Workspace Access Disabled':'Access Check Needed'}</h2><p>${esc(authState.user.email||'Signed-in account')}</p></div>
      <div style="font-size:44px;margin:8px 0">${pending?'⏳':blocked?'🔒':'⚠️'}</div>
      <p style="line-height:1.6">${pending?'Your account is signed in, but it is still <strong>Pending Approval</strong>. An Owner/Admin must approve it before the Freelance Desk opens.':blocked?'This account is currently <strong>Blocked</strong> from Freelance Desk. Contact the workspace Owner/Admin if you believe this should be changed.':'Freelance Desk could not confirm your approval status right now.'}</p>
      ${authState.error?`<div class="auth-alert error" style="text-align:left"><span>⚠️</span><div>${esc(authState.error)}</div></div>`:''}
      <div class="actions" style="justify-content:center;margin-top:18px"><button class="btn primary" onclick="refreshAccessStatus()">↻ Refresh Access</button><button type="button" class="btn bad btn-signout">Sign Out</button></div>
      <p class="tiny muted" style="margin-top:18px">Authentication and workspace authorization are separate. Signing in does not automatically grant access.</p>
    </div>`;
    return;
  }

  const { mode, error, message } = authState;
  container.innerHTML = `
    <div class="auth-box">
      <div class="auth-header">
        <div class="brandmark">FD</div>
        <h2>Freelance Desk</h2>
        <p>Your free freelancer workspace</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab ${mode==='login'?'active':''}" onclick="setAuthMode('login')">Sign In</button>
        <button class="auth-tab ${mode==='signup'?'active':''}" onclick="setAuthMode('signup')">Request Access</button>
        <button class="auth-tab ${mode==='forgot'?'active':''}" onclick="setAuthMode('forgot')">Reset Password</button>
      </div>

      ${error ? `<div class="auth-alert error"><span>⚠️</span> <div>${esc(error)}</div></div>` : ''}
      ${message ? `<div class="auth-alert success"><span>✓</span> <div>${esc(message)}</div></div>` : ''}

      <button type="button" id="googleSignInBtn" class="auth-btn-google" onclick="handleGoogleSignIn(event)" ${isGoogleSigningIn ? 'disabled style="opacity:0.6;cursor:not-allowed"' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        ${isGoogleSigningIn ? 'Connecting to Google...' : 'Continue with Google'}
      </button>

      <div class="auth-divider"><span>or with email</span></div>

      <form onsubmit="handleAuthSubmit(event)" style="display:flex;flex-direction:column;gap:12px">
        ${mode === 'signup' ? `<div><label>Full Name</label><input type="text" id="authName" class="input" placeholder="e.g. Maria Santos" required></div>` : ''}
        <div><label>Email Address</label><input type="email" id="authEmail" class="input" placeholder="you@example.com" required></div>
        ${mode !== 'forgot' ? `<div><label>Password</label><input type="password" id="authPassword" class="input" placeholder="••••••••" required minlength="6"></div>` : ''}
        <button type="submit" class="btn primary" style="padding:12px;margin-top:6px;width:100%;font-weight:800" id="authSubmitBtn">${mode === 'login' ? 'Sign In to Workspace' : mode === 'signup' ? 'Create Account & Request Access' : 'Send Reset Link'}</button>
      </form>
      ${mode==='signup'?'<p class="tiny muted" style="text-align:center;margin-top:14px">New accounts are created as Pending and require Owner/Admin approval before workspace access.</p>':''}
    </div>`;
}

async function handleGoogleSignIn(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }

  if (!auth) {
    authState.error = "Firebase Authentication is unavailable.";
    renderAuthPortal();
    return;
  }

  if (isGoogleSigningIn) {
    return;
  }

  isGoogleSigningIn = true;
  authState.error = "";
  authState.message = "";

  const btn = document.getElementById("googleSignInBtn");
  if (btn) {
    btn.disabled = true;
    btn.style.opacity = "0.6";
    btn.style.cursor = "not-allowed";
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Connecting to Google...`;
  }

  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  } catch (err) {
    if (err && (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request")) {
      console.warn("Google sign-in popup closed or cancelled by user:", err.code);
    } else {
      console.error("Google sign-in error:", err);
    }
    authState.error = formatAuthError(err);
    renderAuthPortal();
  } finally {
    isGoogleSigningIn = false;
    const btnEnd = document.getElementById("googleSignInBtn");
    if (btnEnd) {
      btnEnd.disabled = false;
      btnEnd.style.opacity = "1";
      btnEnd.style.cursor = "pointer";
      btnEnd.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Continue with Google`;
    }
  }
}

function handleAuthSubmit(e) {
  e.preventDefault();
  if (!auth) {
    authState.error = "Firebase Authentication is unavailable.";
    renderAuthPortal();
    return;
  }
  const emailEl = document.getElementById("authEmail");
  const passEl = document.getElementById("authPassword");
  const nameEl = document.getElementById("authName");
  
  const email = emailEl ? emailEl.value.trim() : "";
  const pass = passEl ? passEl.value : "";
  const name = nameEl ? nameEl.value.trim() : "";

  const btn = document.getElementById("authSubmitBtn");
  if (btn) btn.disabled = true;

  authState.error = "";
  authState.message = "";

  if (authState.mode === "login") {
    auth.signInWithEmailAndPassword(email, pass).catch(err => {
      authState.error = formatAuthError(err);
      renderAuthPortal();
    });
  } else if (authState.mode === "signup") {
    auth.createUserWithEmailAndPassword(email, pass)
      .then(cred => {
        if (name && cred.user) {
          cred.user.updateProfile({ displayName: name });
        }
      })
      .catch(err => {
        authState.error = formatAuthError(err);
        renderAuthPortal();
      });
  } else if (authState.mode === "forgot") {
    auth.sendPasswordResetEmail(email)
      .then(() => {
        authState.message = "Password reset link sent! Please check your email.";
        renderAuthPortal();
      })
      .catch(err => {
        authState.error = formatAuthError(err);
        renderAuthPortal();
      });
  }
}

async function handleSignOut(e, btnEl) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  if (!auth) {
    alert("Firebase Authentication is unavailable.");
    return;
  }
  if (isSigningOut) return;

  if (!confirm("Sign out of Freelance Desk?")) {
    return;
  }

  isSigningOut = true;

  const targetBtns = btnEl ? [btnEl] : Array.from(document.querySelectorAll(".btn-signout"));
  const origBtnStates = [];
  targetBtns.forEach(btn => {
    if (btn) {
      origBtnStates.push({ btn, html: btn.innerHTML });
      btn.disabled = true;
      btn.style.opacity = "0.6";
      btn.style.cursor = "not-allowed";
      btn.innerHTML = "Signing out...";
    }
  });

  try {
    await auth.signOut();
    toast("Signed out successfully");
  } catch (err) {
    console.error("Sign out error:", err);
    alert("Failed to sign out: " + (err.message || "Unknown error"));
    origBtnStates.forEach(({ btn, html }) => {
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
        btn.innerHTML = html;
      }
    });
  } finally {
    isSigningOut = false;
  }
}

document.addEventListener("click", async (event) => {
  const btn = event.target.closest(".btn-signout");
  if (!btn) return;

  event.preventDefault();
  event.stopPropagation();
  await handleSignOut(event, btn);
});

function formatAuthError(err) {
  if (!err) return "An unknown error occurred.";
  switch (err.code) {
    case "auth/user-not-found":
    case "auth/wrong-password":
    case "auth/invalid-credential":
      return "Invalid email address or password.";
    case "auth/email-already-in-use":
      return "An account with this email address already exists.";
    case "auth/weak-password":
      return "Password must be at least 6 characters long.";
    case "auth/invalid-email":
      return "Please enter a valid email address.";
    case "auth/popup-closed-by-user":
      return "Google sign-in popup was closed before completing sign-in.";
    case "auth/popup-blocked":
      return "Google sign-in popup was blocked by your browser. Please allow popups for this site.";
    case "auth/cancelled-popup-request":
      return "Sign-in request was cancelled. Please try again.";
    default:
      return err.message || "Authentication failed.";
  }
}

function updateAuthUI() {
  const appEl = document.querySelector(".app");
  const authEl = document.getElementById("authContainer");
  const badgeEl = document.getElementById("userHeaderBadge");
  const approved = !!authState.user && authState.accessStatus === "approved";

  if (authState.loading || !approved) {
    if (appEl) appEl.classList.add("hidden");
    if (authEl) {
      authEl.classList.remove("hidden");
      renderAuthPortal();
    }
    if(badgeEl)badgeEl.innerHTML="";
  } else {
    if (appEl) appEl.classList.remove("hidden");
    if (authEl) authEl.classList.add("hidden");

    if (badgeEl) {
      const u = authState.user;
      const initial = (u.displayName || u.email || "U").charAt(0).toUpperCase();
      badgeEl.innerHTML = `
        <div class="user-badge">
          <div class="user-badge-avatar">${esc(initial)}</div>
          <span class="small strong">${esc(u.displayName || (u.email ? u.email.split('@')[0] : 'User'))}</span>
          <span class="pill" title="Platform role">${esc(platformRoleLabel(currentPlatformRole()))}</span>
          <button type="button" class="btn sm bad btn-signout" style="margin-left:4px">Sign Out</button>
        </div>`;
    }
    render();
  }
}
